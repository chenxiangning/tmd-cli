[package]
name = "tmd-mobile"
version = "0.1.0"
description = "tmd-cli mobile 壳:iOS/Android Webview 容器,Rust 侧零业务命令,数据面全部走 transport 远程模式连桌面桥"
edition = "2021"
rust-version = "1.82"

[lib]
name = "tmd_mobile_lib"
# iOS 走静态链(staticlib + Xcode 里的 Swift shim);不放 cdylib —— 独立 cargo link
# 阶段解析不到 Tauri Swift 符号会 65。
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Release 资产嵌入(frontendDist ../dist);不嵌入则壳 WebView 无页面可加载
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
