[package]
name = "tmd-cli"
version = "0.1.0"
description = "Plugin-based multi-CLI desktop client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tmd_cli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
parking_lot = "0.12"
tauri-plugin-dialog = "2.0.0-rc.8"
