name: Release

# 触发方式:
#   1. 推送 v* 形式的 tag (v0.1.0 / v1.2.3-rc1) → 自动跑
#   2. 手动从 GitHub Actions UI 触发 (Run workflow)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 同一 tag 触发的重复 build 别互相取消 — 产物可能要发 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# GITHUB_TOKEN 仅授予 contents 写:tauri-action 建 Draft Release / 上传产物所需,
# 不给更高权限。公证凭据(APPLE_*)仅当 repo secrets 已配置才注入 macOS 构建步
# (见「macOS 签名/公证凭据注入」步);未配置 = 未签名未公证,与历史构建一致。
# TAURI_SIGNING_* 为 updater 通道的
# minisign 私钥(本地 ~/.tauri/tmd-cli.key,空密码)——注入后 tauri-action 自动
# 产出 .tar.gz/.sig 签名产物与 latest.json,应用内「自动更新」依赖它;secret
# 未配置时构建仍成功,只是更新通道无最新产物(前端落错误态,可前往下载兜底)。
permissions:
  contents: write

jobs:
  # 前置单 job 先建 Draft:tauri-action 的 getOrCreateRelease 有并发建重窗口
  # (GitHub 允许同 tag 多 draft,产物会静默分家),先建好大家只复用。
  prep-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 同 tag 重跑会复用旧 release。上游 tauri-action upload-version-json.ts 对
            # universal darwin 只在 darwin-aarch64/x86_64 键不存在时才写入("Don't
            # overwrite native builds" 守卫),残留的 latest.json 会让新构建签名被陈旧
            # 条目挡住 → 应用内更新验签失败(v0.2.3 实证)。先删 latest.json,让本轮
            # 全平台条目重新生成;其余产物由 tauri-action --clobber 原地覆盖,无需处理。
            # gh release delete-asset 走 FetchRelease(draft/published 双态命中);
            # 旧式按 tag 查 releases/tags 对 draft release 恒 404,会把
            # 「删 tag 重推(GitHub 自动转回 draft)」场景的清资产步骤打死。
            if gh release delete-asset "$GITHUB_REF_NAME" latest.json \
              --repo "$GITHUB_REPOSITORY" -y > /dev/null 2>&1; then
              echo "已删除陈旧 latest.json"
            else
              echo "无 latest.json 或已删,继续"
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "tmd-cli $GITHUB_REF_NAME" \
              --notes "Automated build. See commit log for changes." --repo "$GITHUB_REPOSITORY"
          fi

  build:
    needs: prep-release
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || needs.prep-release.result == 'skipped') }}
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false # 某个平台挂了不影响其他平台产物落地
      matrix:
        include:
          # 分架构双产物(2026-09-29 包体优化):universal dmg/updater 39.3MB 二进制
          # 对半砍,用户下载 26.6→~14MB、更新流量减半;tauri-action 按
          # darwin-aarch64 / darwin-x86_64 双键写 latest.json(prep-release 已有
          # 陈旧 latest.json 清障,universal 客户端按当前 CPU 架构命中对应键)。
          - platform: macos-latest
            tauri-target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            label: "macOS (aarch64)"
          - platform: macos-latest
            tauri-target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            label: "macOS (x86_64)"
          - platform: windows-latest
            tauri-target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            label: "Windows (x86_64)"
          - platform: ubuntu-latest
            tauri-target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            label: "Linux (x86_64)"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---------- 前端 ----------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri-action 会自动跑 tauri.conf.json 里的 beforeBuildCommand (= npm run build),
      # 不用在这里手动 pnpm build,避免重复构建。

      # ---------- Rust ----------
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Linux runner 需要手动装 webkit2gtk;mac/win 由 tauri-action 内部处理。
      - name: Tauri Linux 系统依赖
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      # ---------- ⭐ 核心打包 ----------
      # macOS 代码签名 + 公证凭据注入(批次七 2026-09-26):repo secrets 配齐才生效。
      # 基线:tauri.conf.json bundle.macOS.signingIdentity "-" 已让 bundler 做全 bundle
      # ad-hoc 封签(2026-09-29,分架构 thin 二进制后链接器残留签名会触发 Gatekeeper
      # 「已损坏」硬拦,ad-hoc 封签恢复「仍要打开」软拦);本步 env 注入后优先级更高
      # (tauri-cli 先读 env APPLE_SIGNING_IDENTITY 再回落 config),配齐即升级为
      # Developer ID 签名 + notarytool 公证。所需 secrets:
      #   APPLE_CERTIFICATE           base64 的 .p12(Developer ID Application 证书)
      #   APPLE_CERTIFICATE_PASSWORD  p12 导出密码
      #   APPLE_SIGNING_IDENTITY      "Developer ID Application: <Team 名>"
      #   APPLE_ID / APPLE_PASSWORD   Apple ID + App 专用密码(notarytool)
      #   APPLE_TEAM_ID               Team ID
      # Windows 签名:需先定证书采购形态(OV/EV p12 或 Azure Trusted Signing),
      # 决策后经 signCommand 接线;当前如实未签(SmartScreen 提示)。
      - name: macOS 签名/公证凭据注入(未配 secret 则跳过)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 六件套逐个核对:缺任一即整组跳过并点名(只看证书会漏配半套,
          # 失败深藏在公证段报难懂错误)。值经 env: 映射进脚本,不走表达式内插 ——
          # 防 p12 密码含引号/反引号或 Linux base64 折行多行值打碎脚本与 GITHUB_ENV 行。
          # (注释里写字面美元花括号对会被 Actions 表达式引擎当真解析,曾致全流编译挂)
          missing=""
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(eval "echo \$$k")" ]; then missing="$missing $k"; fi
          done
          if [ -n "$missing" ]; then
            echo "未配齐签名/公证凭据(缺:$missing),跳过注入(产物保持 ad-hoc 签名未公证)"
            exit 0
          fi
          {
            for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                     APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              v=$(eval "echo \$$k")
              printf '%s<<TMD_EOF\n%s\nTMD_EOF\n' "$k" "$v"
            done
          } >> "$GITHUB_ENV"

      # tauri-apps/tauri-action 是 Tauri 官方 GitHub Action,跨平台 build + 签名 + 公证 + 上传 artifact。
      # 凭据是否注入由上一步决定:未配 APPLE_* secrets 时产物为 ad-hoc 签名未公证。
      # updater 通道 TAURI_SIGNING_PRIVATE_KEY 与签名无关,见下方 env 注释。
      # tagName 动态取值:推送 v* tag 时非空 → 自动创建 Draft Release 并挂全部产物;
      # workflow_dispatch 手动触发时为空串 → 只构建;tauri-action 不会上传任何
      # workflow artifact,产物由下一步 upload-artifact 兜底落面板。
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          # 内置仓库令牌,专供发布上传(建 Draft Release 挂产物);与签名无关。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 通道 minisign 私钥:注入后自动产出签名产物 + latest.json;
          # 私钥内容经 repo secret TAURI_SIGNING_PRIVATE_KEY 配置(空密码)。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('tmd-cli {0}', github.ref_name) || '' }}
          releaseBody: "Automated build. See commit log for changes."
          releaseDraft: true
          args: --target ${{ matrix.tauri-target }}

      # 手动触发兜底:tauri-action 无 tagName 时产物不上传,job 结束即丢。
      # tag run 的产物直接挂 Release,不重复上传。
      - name: 上传构建产物(仅手动触发)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: tmd-cli-bundle-${{ matrix.tauri-target }}
          path: src-tauri/target/${{ matrix.tauri-target }}/release/bundle/


  # ---------- 手机 app(Android 壳)----------
  # Kotlin+WebView 薄壳(mobile-app/android-shell),与桌面四 job 并行;产物:
  # 仓内 keystore 自签的 release APK(app-release.apk,侧载可装可覆盖升级)。
  android:
    name: "Android (universal APK)"
    runs-on: ubuntu-latest
    needs: prep-release
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || needs.prep-release.result == 'skipped') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versionCode = 提交数,需全量历史

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 壳二进制与前端 dist 必须同包(build-device-android.sh 同规则);
      # 手机壳背 mobile-only dist(vite.mobile.config.ts,无条件 mobile 树
      # ~1MB),不再拷全量 dist(17MB,含 DesktopApp/excalidraw 等桌面死重)。
      - name: Build mobile dist
        run: pnpm build:mobile

      - name: Copy dist into shell assets
        run: |
          rm -rf mobile-app/android-shell/app/src/main/assets/dist
          mkdir -p mobile-app/android-shell/app/src/main/assets
          cp -R dist-mobile mobile-app/android-shell/app/src/main/assets/dist

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-24.04 镜像预装全套 Android SDK(ANDROID_HOME 已设、license 已接受);
      # android-actions/setup-android 反而会在自身 sdkmanager 步撞 license 交互挂掉(v0.2.3 实证)。
      - name: Accept Android licenses(防御)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # 版本随 tag 注入(versionCode = 提交数,单调);release 用仓内自签 keystore
      # (keystore/tmd-release.keystore)——零成本侧载分发,签名稳定可覆盖升级。
      - name: Gradle assembleRelease(wrapper 钉 8.10.2;runner 预装 gradle 9.x 与 AGP 8.7 不兼容)
        run: |
          cd mobile-app/android-shell
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PversionName="${GITHUB_REF_NAME#v}" \
            -PversionCode="$(git rev-list --count HEAD)"

      # Draft Release 由 tauri-action(桌面 build job)创建;手机 job 可能先跑完,
      # 轮询等它出现再挂产物(softprops 二次创建会出重复 release,故用 gh CLI --clobber)。
      - name: Attach APK to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME"             mobile-app/android-shell/app/build/outputs/apk/release/app-release.apk             --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload APK artifact(仅手动触发)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: tmd-cli-android-apk
          path: mobile-app/android-shell/app/build/outputs/apk/release/

  # ---------- 手机 app(iOS 壳,未签名)----------
  # 原生 SwiftUI 壳(mobile-app/native-shell)。CI 无分发证书 → CODE_SIGNING_ALLOWED=NO
  # 出未签名 .app(侧载需用户自签;真机日常装用本地 scripts/build-device.sh)。
  ios-shell:
    name: "iOS (arm64, unsigned)"
    runs-on: macos-latest
    needs: prep-release
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || needs.prep-release.result == 'skipped') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # CFBundleVersion = 提交数,需全量历史

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build mobile dist
        run: pnpm build:mobile

      - name: Copy dist for shell bundle
        run: |
          rm -rf mobile-app/dist
          cp -R dist-mobile mobile-app/dist

      - name: xcodebuild (unsigned)
        run: |
          cd mobile-app/native-shell
          xcodebuild \
            -project tmd-native-shell.xcodeproj \
            -scheme 'tmd-cli mobile' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/tmd-ios-ci \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build

      - name: Stamp version into bundle
        run: |
          PLIST="/tmp/tmd-ios-ci/Build/Products/Release-iphoneos/tmd-cli mobile.app/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" "$PLIST"
          plutil -replace CFBundleVersion -string "$(git rev-list --count HEAD)" "$PLIST"

      - name: Zip .app
        run: |
          cd /tmp/tmd-ios-ci/Build/Products/Release-iphoneos
          zip -qry /tmp/tmd-cli-mobile-unsigned.zip "tmd-cli mobile.app"

      # 同 android job:等 tauri-action 的 Draft 出现再挂,避免重复 release
      - name: Attach iOS zip to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 90); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            { echo "Draft release 未在限时内出现(桌面构建超 45 分钟?)" >&2; exit 1; }
          gh release upload "$GITHUB_REF_NAME" /tmp/tmd-cli-mobile-unsigned.zip --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload artifact(仅手动触发)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: tmd-cli-ios-unsigned
          path: /tmp/tmd-cli-mobile-unsigned.zip
