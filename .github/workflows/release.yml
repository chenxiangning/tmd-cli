name: Release

# 触发方式:
#   1. 推送 v* 形式的 tag (v0.1.0 / v1.2.3-rc1) → 自动跑
#   2. 手动从 GitHub Actions UI 触发 (Run workflow)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 同一 tag 触发的重复 build 别互相取消 — 产物可能要发 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# GITHUB_TOKEN 仅授予 contents 写:tauri-action 建 Draft Release / 上传产物所需,
# 不给更高权限;签名/公证凭据(APPLE_* / TAURI_SIGNING_*)仍不引入。
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false # 某个平台挂了不影响其他平台产物落地
      matrix:
        include:
          - platform: macos-latest
            tauri-target: universal-apple-darwin
            # rustup 不认识 universal-apple-darwin;Tauri universal 构建需先装两个真实 target
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            label: "macOS (universal: arm64 + x86_64)"
          - platform: windows-latest
            tauri-target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            label: "Windows (x86_64)"
          - platform: ubuntu-latest
            tauri-target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            label: "Linux (x86_64)"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 前端 ----------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri-action 会自动跑 tauri.conf.json 里的 beforeBuildCommand (= npm run build),
      # 不用在这里手动 pnpm build,避免重复构建。

      # ---------- Rust ----------
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Linux runner 需要手动装 webkit2gtk;mac/win 由 tauri-action 内部处理。
      - name: Tauri Linux 系统依赖
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      # ---------- ⭐ 核心打包 ----------
      # tauri-apps/tauri-action 是 Tauri 官方 GitHub Action,跨平台 build + 签名 + 公证 + 上传 artifact。
      # 这里完全不传任何 APPLE_* / TAURI_SIGNING_* 凭据
      #   → 等价于本地的 --skip-sign --skip-notarize,零成本,未签名/未公证,与 release-mac-local.sh 行为一致。
      # tagName 动态取值:推送 v* tag 时非空 → 自动创建 Draft Release 并挂全部产物;
      # workflow_dispatch 手动触发时为空串 → 只构建;tauri-action 不会上传任何
      # workflow artifact,产物由下一步 upload-artifact 兜底落面板。
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          # 内置仓库令牌,专供发布上传(建 Draft Release 挂产物);与签名无关。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('tmd-cli {0}', github.ref_name) || '' }}
          releaseBody: "Automated build. See commit log for changes."
          releaseDraft: true
          args: --target ${{ matrix.tauri-target }}

      # 手动触发兜底:tauri-action 无 tagName 时产物不上传,job 结束即丢。
      # tag run 的产物直接挂 Release,不重复上传。
      - name: 上传构建产物(仅手动触发)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: tmd-cli-bundle-${{ matrix.tauri-target }}
          path: src-tauri/target/${{ matrix.tauri-target }}/release/bundle/

