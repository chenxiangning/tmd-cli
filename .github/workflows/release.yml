name: Release

# 触发方式:
#   1. 推送 v* 形式的 tag (v0.1.0 / v1.2.3-rc1) → 自动跑
#   2. 手动从 GitHub Actions UI 触发 (Run workflow)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 同一 tag 触发的重复 build 别互相取消 — 产物可能要发 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false # 某个平台挂了不影响其他平台产物落地
      matrix:
        include:
          - platform: macos-latest
            tauri-target: universal-apple-darwin
            # rustup 不认识 universal-apple-darwin;Tauri universal 构建需先装两个真实 target
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            label: "macOS (universal: arm64 + x86_64)"
          - platform: windows-latest
            tauri-target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            label: "Windows (x86_64)"
          - platform: ubuntu-latest
            tauri-target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            label: "Linux (x86_64)"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 前端 ----------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri-action 会自动跑 tauri.conf.json 里的 beforeBuildCommand (= npm run build),
      # 不用在这里手动 pnpm build,避免重复构建。

      # ---------- Rust ----------
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Linux runner 需要手动装 webkit2gtk;mac/win 由 tauri-action 内部处理。
      - name: Tauri Linux 系统依赖
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      # ---------- ⭐ 核心打包 ----------
      # tauri-apps/tauri-action 是 Tauri 官方 GitHub Action,跨平台 build + 签名 + 公证 + 上传 artifact。
      # 这里完全不传任何 APPLE_* / TAURI_SIGNING_* 凭据
      #   → 等价于本地的 --skip-sign --skip-notarize
      #   → 零成本,未签名/未公证,跟 release-mac-local.sh 行为一致
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.tauri-target }}

      # ---------- 可选:让产物直接挂到 GitHub Release ----------
      # 当前未开启 (没有 tagName),产物只会落到 workflow run 的 Artifacts 面板下载。
      # 真要对外发版时,把下面这块的注释打开,并把触发器里的 workflow_dispatch 改成只在 UI 选 tag。
      #
      # - name: Publish to GitHub Release
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: tauri-apps/tauri-action@v0
      #   with:
      #     projectPath: src-tauri
      #     args: --target ${{ matrix.tauri-target }}
      #     tagName: ${{ github.ref_name }}
      #     releaseName: "tmd-cli ${{ github.ref_name }}"
      #     releaseBody: "Automated build. See commit log for changes."
      #     releaseDraft: true
