name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 文件规模铁则:单文件 ≤300 行(docs/architecture/02-code-architecture.md)
      - name: 300 行铁则
        run: pnpm check:file-size
      # 架构边界铁则:R1 kernel↛plugins / R3 ipc 唯一通道 / R4 plugins↛app-shell
      - name: 架构边界铁则
        run: pnpm check:arch-boundary
      # i18n 键三语同步:t() 字面量键 × en/ja 词典全量比对(scripts/check-i18n-keys.mjs)
      - name: i18n 键三语同步
        run: pnpm check:i18n-keys

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo check
