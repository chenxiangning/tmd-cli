<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>批次审批 · 方案 C「全屏回放台」</title>
<style>
  /* ═══════════════════════════════════════════════════════
     方案 C · 全屏回放台 —— Esc Esc 唤起的 overlay(挂载点已有)。
     定位:重审核场景,多批联审、批量回退。
     核心主张:
       1) 左轴=批次时间线(带 prompt 摘要与 resume 断档线),
          右区=选中批 vs 当前的合成 diff 树 —— 审核即对照
       2) 动作条支持「回退此批 / 回退此批之后全部 / 复制 prompt
          重新出发」三档力度,覆盖探索回退与重来两种动机
       3) 对齐 Claude Code /rewind 与 omp rewind-selector 的
          Esc Esc 肌肉记忆;断档线诚实呈现 resume 边界
     全部颜色来自 --tmd-* 体系(dark)。交互:左轴切换、文件组
     折叠、三档动作、「仅看未审」过滤、Esc 关闭/重开。
     ═══════════════════════════════════════════════════════ */
  :root {
    --tmd-bg-base: #1f1f1f; --tmd-bg-elevated: #181818; --tmd-bg-sunken: #181818;
    --tmd-bg-hover: #2a2a2a; --tmd-bg-active: rgba(0,122,204,.24);
    --tmd-bg-input: #313131; --tmd-bg-popover: #252526;
    --tmd-fg: #cccccc; --tmd-fg-muted: #9d9d9d; --tmd-fg-subtle: #7a7a7a; --tmd-fg-faint: #585858;
    --tmd-border: #3c3c3c; --tmd-border-strong: #555555;
    --tmd-accent: #007acc; --tmd-accent-fg: #ffffff; --tmd-accent-soft: rgba(0,122,204,.24);
    --tmd-font-ui: 12px; --tmd-radius-sm: 6px; --tmd-radius-md: 8px; --tmd-radius-lg: 12px;
    --diff-ins: #2ea043; --diff-del: #f85149;
    --st-m: #facc20; --st-a: #4ade80;
    --bk-open: #007acc; --bk-pending: #facc20; --bk-kept: #4ade80; --bk-reverted: #a78bfa;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: #101010;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: var(--tmd-font-ui);
    color: var(--tmd-fg);
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #4a4a4a80; border-radius: 4px; }

  /* ── 背景窗口 mock(示意"从工作台唤起")── */
  .window {
    width: 1080px; height: 680px; position: relative;
    background: var(--tmd-bg-base);
    border: 1px solid var(--tmd-border);
    border-radius: var(--tmd-radius-lg);
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,.55);
    filter: blur(2px) brightness(.4);
    transition: filter .2s ease;
  }
  .window .fake { padding: 60px 40px; color: var(--tmd-fg-faint); font-family: "SF Mono", Menlo, monospace; }

  /* ── 回放台 overlay(盖满窗口)── */
  .replay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--tmd-bg-sunken) 92%, transparent);
    backdrop-filter: blur(14px);
    animation: replay-in .18s ease;
  }
  @keyframes replay-in { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }

  .rp-top {
    flex: none; height: 44px;
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    border-bottom: 1px solid var(--tmd-border);
    background: var(--tmd-bg-elevated);
  }
  .rp-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .rp-title svg { color: var(--tmd-accent); }
  .sess-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 8px 1px 6px; border-radius: 999px;
    background: var(--tmd-accent-soft); color: #7ec3f0; font-weight: 500;
  }
  .sess-chip .abbr { font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 4px;
    background: rgba(0,122,204,.32); color: #9fd1f5; }
  .kbd-hint {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--tmd-fg-faint); font-size: 11px;
  }
  .kbd-hint kbd {
    font: 10px/1 inherit; padding: 3px 5px; border-radius: 4px;
    background: rgba(255,255,255,.06); color: var(--tmd-fg-faint);
    border: 1px solid var(--tmd-border);
  }
  .rp-top .spacer { flex: 1; }
  .close-btn {
    width: 26px; height: 26px; border-radius: var(--tmd-radius-sm);
    display: grid; place-items: center; color: var(--tmd-fg-subtle);
  }
  .close-btn:hover { background: var(--tmd-bg-hover); color: var(--tmd-fg); }

  /* ── 主体:左时间轴 + 右 diff ── */
  .rp-body { flex: 1; min-height: 0; display: flex; }

  .tl {
    width: 280px; flex: none;
    border-right: 1px solid var(--tmd-border);
    overflow-y: auto; padding: 10px 8px;
  }
  .tl-head {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 8px 8px; color: var(--tmd-fg-muted); font-weight: 600; font-size: 11px;
    letter-spacing: .02em;
  }
  .tl-head .n { font-weight: 400; color: var(--tmd-fg-faint); font-variant-numeric: tabular-nums; }

  .tl-item {
    position: relative; display: flex; gap: 9px;
    padding: 7px 8px 7px 10px; border-radius: var(--tmd-radius-sm);
    cursor: pointer; user-select: none;
  }
  .tl-item:hover { background: var(--tmd-bg-hover); }
  .tl-item.sel { background: var(--tmd-bg-active); }
  .tl-item::before {               /* 时间轴竖线 */
    content: ""; position: absolute; left: 14px; top: 26px; bottom: -4px;
    width: 1px; background: var(--tmd-border);
  }
  .tl-item:last-child::before { display: none; }
  .tl-dot {
    flex: none; width: 10px; height: 10px; margin-top: 3px; border-radius: 50%;
    position: relative; z-index: 2; background: var(--tmd-bg-sunken);
    border: 2px solid var(--tmd-border-strong);
  }
  .tl-dot.open { border-color: var(--bk-open); background: var(--bk-open); animation: breathe 1.6s ease infinite; }
  .tl-dot.pending { border-color: var(--bk-pending); background: var(--bk-pending); }
  .tl-dot.kept { border-color: var(--bk-kept); background: var(--bk-kept); }
  .tl-dot.reverted { border-color: var(--bk-reverted); background: var(--bk-reverted); }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .tl-main { flex: 1; min-width: 0; }
  .tl-l1 { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
  .tl-l1 .no { color: var(--tmd-fg-faint); font-variant-numeric: tabular-nums; flex: none; }
  .tl-l1 .prompt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tmd-fg); }
  .tl-item.dimmed .tl-l1 .prompt { color: var(--tmd-fg-faint); text-decoration: line-through; }
  .tl-l2 { display: flex; gap: 6px; align-items: center; color: var(--tmd-fg-faint); font-size: 11px;
    white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
  .tl-l2 .ins { color: var(--diff-ins); }
  .tl-l2 .del { color: var(--diff-del); }
  .badge { flex: none; padding: 0 6px; border-radius: 999px; font-size: 9.5px; line-height: 15px; font-weight: 600; }
  .badge.pending { background: rgba(250,204,32,.14); color: var(--bk-pending); }
  .badge.kept { background: rgba(74,222,128,.14); color: var(--bk-kept); }
  .badge.reverted { background: rgba(167,139,250,.16); color: var(--bk-reverted); }
  .badge.open { background: var(--tmd-accent-soft); color: #7ec3f0; }

  /* resume 断档线 */
  .tl-gap {
    display: flex; align-items: center; gap: 7px;
    margin: 8px 4px 10px; padding: 0 8px;
    color: var(--tmd-fg-faint); font-size: 10.5px;
  }
  .tl-gap::before, .tl-gap::after { content: ""; flex: 1; height: 1px; background: var(--tmd-border); }
  .tl-item.readonly .tl-l1 .prompt, .tl-item.readonly .tl-l2 { opacity: .55; }

  /* ── 右区:选中批详情 ── */
  .detail { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dt-head {
    flex: none; padding: 12px 16px 10px;
    border-bottom: 1px solid var(--tmd-border);
  }
  .dt-prompt { font-size: 13px; font-weight: 600; line-height: 1.5; margin-bottom: 4px; }
  .dt-meta { display: flex; gap: 10px; align-items: center; color: var(--tmd-fg-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .dt-meta .ins { color: var(--diff-ins); }
  .dt-meta .del { color: var(--diff-del); }
  .dt-meta .vs { color: var(--tmd-fg-subtle); }

  .dt-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 16px 16px; }

  .fgroup { margin-bottom: 8px; border: 1px solid var(--tmd-border); border-radius: var(--tmd-radius-sm); overflow: hidden; }
  .fg-head {
    display: flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 9px; cursor: pointer; user-select: none;
    background: var(--tmd-bg-elevated);
  }
  .fg-head:hover { background: var(--tmd-bg-hover); }
  .fg-head .caret { color: var(--tmd-fg-faint); transition: transform .15s; }
  .fgroup.open .fg-head .caret { transform: rotate(90deg); }
  .fg-head .st { flex: none; width: 15px; height: 15px; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
  .fg-head .st.M { background: rgba(250,204,32,.16); color: var(--st-m); }
  .fg-head .st.A { background: rgba(74,222,128,.16); color: var(--st-a); }
  .fg-head .path { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: var(--tmd-fg); }
  .fg-head .path span { color: var(--tmd-fg-faint); }
  .fg-head .pm { flex: none; font-variant-numeric: tabular-nums; font-size: 11px; }
  .fg-head .pm .ins { color: var(--diff-ins); }
  .fg-head .pm .del { color: var(--diff-del); }
  .fg-head .rv1 {
    flex: none; height: 20px; padding: 0 7px; border-radius: 5px;
    display: none; align-items: center; gap: 4px;
    border: 1px solid var(--tmd-border); color: var(--tmd-fg-subtle); font-size: 10.5px;
  }
  .fg-head:hover .rv1 { display: inline-flex; }
  .fg-head .rv1:hover { border-color: rgba(167,139,250,.5); color: var(--bk-reverted); }
  .fg-body { display: none; }
  .fgroup.open .fg-body { display: block; }
  .fg-body pre { margin: 0; padding: 7px 10px; overflow-x: auto;
    font-family: "SF Mono", Menlo, monospace; font-size: 11px; line-height: 1.6; }
  .dl-add { color: var(--diff-ins); background: rgba(46,160,67,.10); display: block; }
  .dl-del { color: var(--diff-del); background: rgba(248,81,73,.10); display: block; }
  .dl-ctx { color: var(--tmd-fg-subtle); display: block; }
  .dl-hnk { color: var(--tmd-fg-faint); display: block; }

  /* ── 底部动作条 ── */
  .rp-actions {
    flex: none; height: 46px;
    display: flex; align-items: center; gap: 8px; padding: 0 14px;
    border-top: 1px solid var(--tmd-border);
    background: var(--tmd-bg-elevated);
  }
  .btn {
    height: 27px; padding: 0 12px; border-radius: var(--tmd-radius-sm);
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--tmd-border); color: var(--tmd-fg-muted);
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--tmd-bg-hover); color: var(--tmd-fg); }
  .btn:disabled { opacity: .4; }
  .btn.primary { border-color: transparent; background: var(--tmd-accent-soft); color: #9fd1f5; }
  .btn.primary:hover:not(:disabled) { background: rgba(0,122,204,.36); }
  .btn.danger { border-color: rgba(167,139,250,.4); color: var(--bk-reverted); }
  .btn.danger:hover:not(:disabled) { background: rgba(167,139,250,.12); }
  .btn.toggle.on { border-color: transparent; background: var(--tmd-accent-soft); color: #9fd1f5; }
  .rp-actions .spacer { flex: 1; }
  .retention { color: var(--tmd-fg-faint); font-size: 11px; }

  /* 重开浮标(Esc 关闭后出现) */
  .reopen {
    position: absolute; top: 14px; right: 14px; z-index: 20;
    display: none; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px;
    background: var(--tmd-bg-popover); border: 1px solid var(--tmd-border-strong);
    color: var(--tmd-fg-muted); font-size: 11px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .reopen.show { display: inline-flex; }
  .reopen kbd { font: 10px/1 inherit; padding: 2px 4px; border-radius: 4px;
    background: rgba(255,255,255,.06); color: var(--tmd-fg-faint); }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: 999px;
    background: var(--tmd-bg-popover); border: 1px solid var(--tmd-border-strong);
    color: var(--tmd-fg); font-size: 12px;
    box-shadow: 0 10px 32px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .toast .ok { color: var(--bk-kept); }
  .toast .rv { color: var(--bk-reverted); }
</style>
</head>
<body>

<div class="window" id="win">
  <div class="fake">⏺ omp · 网络代理插件 ──────────────────────────<br><br>
  &nbsp;&nbsp;Edit: src-tauri/src/proxy.rs (+38 −6)<br>
  &nbsp;&nbsp;Bash: cargo check ✓<br><br>
  (回放台盖在幕布之上 —— 右上角浮标或 Esc Esc 重开)</div>

  <div class="reopen" id="reopen"><kbd>Esc Esc</kbd> 重开回放台</div>

  <div class="replay" id="replay">
    <div class="rp-top">
      <span class="rp-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        批次回放台
      </span>
      <span class="sess-chip"><span class="abbr">omp</span>网络代理插件</span>
      <span class="kbd-hint"><kbd>Esc</kbd> 关闭 · <kbd>Esc Esc</kbd> 从任意处唤起</span>
      <span class="spacer"></span>
      <button class="close-btn" id="closeBtn" title="关闭 (Esc)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="rp-body">
      <div class="tl" id="tl">
        <div class="tl-head">批次时间线 <span class="n" id="tlCount"></span></div>
      </div>

      <div class="detail">
        <div class="dt-head" id="dtHead"></div>
        <div class="dt-scroll" id="dtScroll"></div>
      </div>
    </div>

    <div class="rp-actions" id="actions">
      <button class="btn danger" id="actRevert">↩ 回退此批</button>
      <button class="btn danger" id="actRevertAll">↩ 回退此批之后全部</button>
      <button class="btn" id="actCopy">⧉ 复制 prompt 重新出发</button>
      <button class="btn toggle" id="actPending">仅看未审</button>
      <span class="spacer"></span>
      <span class="retention" title="每会话保留最近 100 批快照,超期 30 天清理">保留 100 批/会话 · 30 天</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── 与 A/B 原型同叙事:omp · 网络代理插件会话 ── */
const BATCHES = [
  { no: 6, state: "open", when: "刚刚", prompt: "代理挂掉时给个明确的错误提示吧",
    files: [{ st: "M", name: "proxy.rs", dir: "src-tauri/src/", ins: 38, del: 6 }] },
  { no: 5, state: "pending", when: "2 分钟前", prompt: "把代理设置挂到设置面板里,新增一个分区",
    files: [
      { st: "M", name: "settings.ts", dir: "src/kernel/", ins: 54, del: 3,
        diff: [
          ["ctx", " export interface AppSettings {"],
          ["add", "   proxy: ProxySettings;        // 新增:网络代理分区"],
          ["ctx", "   disabledPlugins: string[];"],
          ["ctx", " }"],
          ["ctx", ""],
          ["add", " export interface ProxySettings {"],
          ["add", "   port: number;                // 0 = 随机可用端口"],
          ["add", "   upstream: string;            // 显式上游,空 = 直连"],
          ["del", " export interface LegacyProxyConf {"],
          ["del", "   legacyPortField: string;     // 旧字段,迁入 ProxySettings"],
          ["ctx", ""],
          ["add", " export function sanitizeProxy(p: unknown): ProxySettings {"],
          ["add", "   // 非法端口回退 0;upstream 仅允许 http(s):// 前缀"],
          ["ctx", "   return { ...DEFAULT_PROXY, ...pickValid(p) };"] ] },
      { st: "M", name: "settings.test.ts", dir: "src/kernel/", ins: 31, del: 0 },
      { st: "M", name: "SidebarSettingsCluster.tsx", dir: "src/app-shell/", ins: 88, del: 12,
        diff: [
          ["ctx", " const CLUSTERS: SettingsSectionContribution[] = ["],
          ["add", "   { id: \"proxy\", label: \"网络代理\", component: ProxySection },"],
          ["ctx", "   { id: \"quota\", label: \"额度\", component: QuotaSection },"],
          ["ctx", " ];" ] ] },
    ] },
  { no: 4, state: "pending", when: "8 分钟前", prompt: "sanitize 加上 proxy 字段清洗,非法端口回退默认",
    files: [
      { st: "M", name: "settings.ts", dir: "src/kernel/", ins: 22, del: 4 },
      { st: "M", name: "settings.test.ts", dir: "src/kernel/", ins: 18, del: 0 },
    ] },
  { no: 3, state: "kept", when: "昨天 21:40", prompt: "提交逻辑挪到 proxyCommit.ts,别混在组件里",
    files: [
      { st: "A", name: "proxyCommit.ts", dir: "src/plugins/network-proxy/", ins: 112, del: 0 },
      { st: "M", name: "index.tsx", dir: "src/plugins/network-proxy/", ins: 12, del: 64 },
      { st: "A", name: "proxyCommit.test.ts", dir: "src/plugins/network-proxy/", ins: 47, del: 0 },
    ] },
  { no: 2, state: "reverted", when: "昨天 21:12", prompt: "顺手把 Cargo.toml 的 reqwest 降到 0.12",
    files: [{ st: "M", name: "Cargo.toml", dir: "src-tauri/", ins: 2, del: 2 }] },
  /* resume 断档线以下:上一段运行的批,只读 */
  { no: 1, state: "kept", when: "09-01 22:31", prompt: "proxy 子模块起个头,先跑通 spawn 生命周期", readonly: true,
    files: [
      { st: "A", name: "proxy.rs", dir: "src-tauri/src/", ins: 214, del: 0 },
      { st: "M", name: "lib.rs", dir: "src-tauri/src/", ins: 9, del: 1 },
    ] },
];

const STATE_TEXT = { open: "进行中", pending: "未审", kept: "已留", reverted: "已退" };
let selected = 5;     /* 默认选中 #5 */
let pendingOnly = false;

const tl = document.getElementById("tl");

function visible() { return BATCHES.filter(b => !pendingOnly || b.state === "pending"); }

function renderTL() {
  tl.querySelectorAll(".tl-item, .tl-gap").forEach(n => n.remove());
  document.getElementById("tlCount").textContent = `· ${visible().length}/${BATCHES.length}`;
  visible().forEach(b => {
    if (b.no === 1) {
      const gap = document.createElement("div");
      gap.className = "tl-gap";
      gap.textContent = "↳ 会话 resume · 09-01 22:14 · 断档前只读";
      tl.appendChild(gap);
    }
    const ins = b.files.reduce((s, f) => s + f.ins, 0);
    const del = b.files.reduce((s, f) => s + f.del, 0);
    const el = document.createElement("div");
    el.className = "tl-item" + (b.no === selected ? " sel" : "")
      + (b.state === "reverted" ? " dimmed" : "") + (b.readonly ? " readonly" : "");
    el.innerHTML = `
      <span class="tl-dot ${b.state}"></span>
      <span class="tl-main">
        <span class="tl-l1"><span class="no">#${b.no}</span><span class="prompt">${esc(b.prompt)}</span></span>
        <span class="tl-l2"><span>${b.files.length} 文件</span>
          <span><span class="ins">+${ins}</span> <span class="del">−${del}</span></span>
          ${b.state !== "open" ? `<span class="badge ${b.state}">${STATE_TEXT[b.state]}</span>` : `<span class="badge open">${STATE_TEXT[b.state]}</span>`}
          <span style="margin-left:auto">${b.when}</span></span>
      </span>`;
    el.addEventListener("click", () => { selected = b.no; renderTL(); renderDetail(); });
    tl.appendChild(el);
  });
}

function renderDetail() {
  const b = BATCHES.find(x => x.no === selected);
  const ins = b.files.reduce((s, f) => s + f.ins, 0);
  const del = b.files.reduce((s, f) => s + f.del, 0);
  document.getElementById("dtHead").innerHTML = `
    <div class="dt-prompt">#${b.no} · ${esc(b.prompt)}</div>
    <div class="dt-meta">
      <span>${b.when}</span><span>omp</span>
      <span>${b.files.length} 文件</span>
      <span><span class="ins">+${ins}</span> <span class="del">−${del}</span></span>
      <span class="vs">对照基准:${b.state === "open" ? "当前工作区(进行中)" : "批次结束时点 ↔ 当前"}</span>
      ${b.readonly ? `<span class="badge kept">断档前 · 只读</span>` : ""}
    </div>`;

  const sc = document.getElementById("dtScroll");
  sc.innerHTML = "";
  b.files.forEach((f, i) => {
    const g = document.createElement("div");
    g.className = "fgroup" + (f.diff && i === 0 ? " open" : "");
    g.innerHTML = `
      <div class="fg-head">
        <span class="caret">›</span>
        <span class="st ${f.st}">${f.st}</span>
        <span class="path"><b>${esc(f.name)}</b> <span>${esc(f.dir)}</span></span>
        <span class="pm"><span class="ins">+${f.ins}</span> <span class="del">−${f.del}</span></span>
        ${b.state === "pending" ? `<button class="rv1">↩ 只回退此文件</button>` : ""}
      </div>
      ${f.diff ? `<div class="fg-body"><pre>${
        f.diff.map(([k, t]) => `<span class="dl-${k === "add" ? "add" : k === "del" ? "del" : "ctx"}">${k === "add" ? "+" : k === "del" ? "−" : " "} ${esc(t)}</span>`).join("")
      }<span class="dl-hnk">@@ -42,7 +42,${f.ins + 9} @@ 展开区间外的行已折叠(patch LRU 完整渲染)</span></pre></div>` : ""}`;
    g.querySelector(".fg-head").addEventListener("click", e => {
      if (e.target.closest(".rv1")) return;
      g.classList.toggle("open");
    });
    const rv1 = g.querySelector(".rv1");
    if (rv1) rv1.addEventListener("click", () =>
      toast(`已回退 ${f.dir}${f.name} · 批次 #${b.no} 转为部分处理(恢复点 #g9 留存)`, "rv"));
    sc.appendChild(g);
  });
}

/* ── 动作条 ── */
const actRevert = document.getElementById("actRevert");
const actRevertAll = document.getElementById("actRevertAll");
const actCopy = document.getElementById("actCopy");
const actPending = document.getElementById("actPending");

function syncActions() {
  const b = BATCHES.find(x => x.no === selected);
  const n = b.files.length;
  actRevert.textContent = b.state === "open" ? "↩ 回退此批(封口当前)" : `↩ 回退此批(${n} 文件)`;
  const newer = BATCHES.filter(x => x.no > selected && !x.readonly);
  const nAll = newer.reduce((s, x) => s + x.files.length, 0) + n;
  actRevertAll.textContent = selected === BATCHES[0].no ? "↩ 回退此批之后全部"
    : `↩ 回退此批之后全部(${newer.length + 1} 批 · ${nAll} 文件)`;
  actRevert.disabled = actRevertAll.disabled = !!b.readonly || b.state === "reverted";
}
actRevert.addEventListener("click", () => {
  const b = BATCHES.find(x => x.no === selected);
  b.state = "reverted";
  renderTL(); syncActions();
  toast(`批次 #${b.no} 已回退(${b.files.length} 文件) · 恢复点 #g9 留存,反悔可回来`, "rv");
});
actRevertAll.addEventListener("click", () => {
  BATCHES.filter(x => x.no >= selected && !x.readonly).forEach(x => x.state = "reverted");
  renderTL(); syncActions();
  toast(`已回退 #${selected} 及之后全部批次 · 每批各留恢复点`, "rv");
});
actCopy.addEventListener("click", () => {
  const b = BATCHES.find(x => x.no === selected);
  toast(`prompt 已复制到 composer:「${b.prompt.slice(0, 18)}…」—— 发出即从该轮重新出发`, "ok");
});
actPending.addEventListener("click", () => {
  pendingOnly = !pendingOnly;
  actPending.classList.toggle("on", pendingOnly);
  if (pendingOnly && !visible().some(b => b.no === selected)) selected = visible()[0]?.no;
  renderTL(); renderDetail(); syncActions();
});

/* ── Esc 关闭 / Esc Esc 重开 ── */
const replay = document.getElementById("replay");
const reopen = document.getElementById("reopen");
let lastEsc = 0, escTimer = 0;
/* Esc(开) = 关闭;Esc Esc(关,600ms 内连击) = 重开 —— 对齐 Claude Code/omp 肌肉记忆 */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (replay.style.display !== "none") {
    replay.style.display = "none"; reopen.classList.add("show"); lastEsc = 0;
  } else if (Date.now() - lastEsc < 600) {
    openReplay();
  } else {
    lastEsc = Date.now();
    clearTimeout(escTimer);
    escTimer = setTimeout(() => lastEsc = 0, 600);
  }
});
function openReplay() {
  replay.style.display = "flex"; replay.style.animation = "none"; void replay.offsetWidth;
  replay.style.animation = ""; reopen.classList.remove("show"); lastEsc = 0;
}
reopen.addEventListener("click", openReplay);
document.getElementById("closeBtn").addEventListener("click", () => {
  replay.style.display = "none"; reopen.classList.add("show"); lastEsc = 0;
});

/* 初始渲染:选中最新未审批 #5 */
selected = 5;
renderTL(); renderDetail(); syncActions();

let toastTimer = 0;
function toast(msg, tone) {
  const t = document.getElementById("toast");
  t.innerHTML = `<span class="${tone}">●</span>${esc(msg)}`;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function esc(s) { return s.replace(/</g, "&lt;"); }
</script>
