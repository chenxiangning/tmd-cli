<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>批次审批 · 方案 D v4「右栏时间线 × 中央批审阅单」</title>
<style>
  /* ═══════════════════════════════════════════════════════
     方案 D v4 —— 评审第四轮修订(用户反馈):
       点批次 ≠ 看 session 原始详情,而是「批审阅单」:
       用户消息全文 + 该轮 AI 修改的文件列表(各自 diff)。
       每批一个中央 tab;时间线点文件行 = 深链到该文件分区。
       右栏无筛选行(状态挂条目);无保留按钮(回退唯一动作);
       提交/内容失配 → 自动已处理。
     挂载点全部复用现有:右栏 registerFilePanel,
     中央 = editorCenter.tabContent —— 零内核新增。
     全部颜色 --tmd-* 体系(dark)。
     ═══════════════════════════════════════════════════════ */
  :root {
    --tmd-bg-base: #1f1f1f; --tmd-bg-elevated: #181818; --tmd-bg-sunken: #181818;
    --tmd-bg-hover: #2a2a2a; --tmd-bg-active: rgba(0,122,204,.24);
    --tmd-bg-input: #313131; --tmd-bg-popover: #252526;
    --tmd-fg: #cccccc; --tmd-fg-muted: #9d9d9d; --tmd-fg-subtle: #7a7a7a; --tmd-fg-faint: #585858;
    --tmd-border: #3c3c3c; --tmd-border-strong: #555555;
    --tmd-accent: #007acc; --tmd-accent-fg: #ffffff; --tmd-accent-soft: rgba(0,122,204,.24);
    --tmd-font-ui: 12px; --tmd-radius-sm: 6px; --tmd-radius-md: 8px; --tmd-radius-lg: 12px;
    --diff-ins: #2ea043; --diff-del: #f85149;
    --st-m: #facc20; --st-a: #4ade80;
    --bk-open: #007acc; --bk-pending: #facc20; --bk-reverted: #a78bfa; --bk-done: #9d9d9d;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: #101010;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: var(--tmd-font-ui);
    color: var(--tmd-fg);
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #4a4a4a80; border-radius: 4px; }

  /* ── 窗口 mock ── */
  .window {
    width: 1180px; height: 700px; position: relative;
    background: var(--tmd-bg-base);
    border: 1px solid var(--tmd-border);
    border-radius: var(--tmd-radius-lg);
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 80px rgba(0,0,0,.55);
  }
  .titlebar {
    height: 38px; flex: none;
    background: var(--tmd-bg-sunken);
    border-bottom: 1px solid var(--tmd-border);
    display: flex; align-items: center; gap: 8px; padding: 0 14px;
    color: var(--tmd-fg-muted); font-size: 12px;
  }
  .titlebar .dots { display: flex; gap: 6px; margin-right: 6px; }
  .titlebar .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .titlebar .dots i:nth-child(1) { background: #ff5f57; }
  .titlebar .dots i:nth-child(2) { background: #febc2e; }
  .titlebar .dots i:nth-child(3) { background: #28c840; }

  .demo-badge {
    position: fixed; top: 14px; left: 14px; z-index: 99;
    padding: 4px 10px; border-radius: 999px;
    background: var(--tmd-bg-popover); border: 1px solid var(--tmd-border);
    color: var(--tmd-fg-muted); font-size: 11px;
  }
  .demo-badge b { color: var(--tmd-fg); }

  .body { flex: 1; display: flex; min-height: 0; }

  /* ── 左:会话侧栏(mock)── */
  .sidebar {
    width: 190px; flex: none;
    background: var(--tmd-bg-elevated);
    border-right: 1px solid var(--tmd-border);
    padding: 10px; color: var(--tmd-fg-subtle);
  }
  .sidebar .ws { padding: 6px 8px; border-radius: var(--tmd-radius-sm); display: flex; align-items: center; gap: 6px; }
  .sidebar .ws.active { background: var(--tmd-bg-active); color: var(--tmd-fg); }
  .sidebar .sess { padding: 4px 8px 4px 22px; color: var(--tmd-fg-faint); white-space: nowrap; overflow: hidden; }
  .sidebar .sess.on { color: var(--tmd-fg-muted); }

  /* ═══ 中央编辑区 ═══ */
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--tmd-bg-base); }

  .tabbar {
    flex: none; height: 34px; display: flex; align-items: stretch;
    border-bottom: 1px solid var(--tmd-border); background: var(--tmd-bg-elevated);
  }
  .tab {
    display: flex; align-items: center; gap: 7px;
    padding: 0 12px; max-width: 260px;
    border-right: 1px solid var(--tmd-border);
    color: var(--tmd-fg-faint); cursor: pointer; user-select: none;
    font-size: 11.5px; position: relative; white-space: nowrap;
  }
  .tab .x { width: 15px; height: 15px; border-radius: 4px; display: grid; place-items: center;
    color: var(--tmd-fg-faint); font-size: 12px; flex: none; }
  .tab .x:hover { background: var(--tmd-bg-hover); color: var(--tmd-fg); }
  .tab.active { background: var(--tmd-bg-base); color: var(--tmd-fg); }
  .tab.active::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1.5px; background: var(--tmd-accent); }
  .tab .bd { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .tab .bd.pending { background: var(--bk-pending); }
  .tab .bd.open { background: var(--bk-open); animation: breathe 1.6s ease infinite; }
  .tab .bd.reverted { background: var(--bk-reverted); }
  .tab .bd.done { border: 1.5px solid var(--bk-done); background: transparent; width: 6px; height: 6px; }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  /* 中央工具行 */
  .view-bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 14px;
    border-bottom: 1px solid var(--tmd-border);
    background: var(--tmd-bg-elevated);
  }
  .view-bar .ctx { color: var(--tmd-fg-faint); font-size: 11px; }
  .view-bar .pm { font-variant-numeric: tabular-nums; font-size: 11px; }
  .view-bar .pm .ins { color: var(--diff-ins); }
  .view-bar .pm .del { color: var(--diff-del); }
  .view-bar .spacer { flex: 1; }
  .btn {
    height: 24px; padding: 0 10px; border-radius: var(--tmd-radius-sm);
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--tmd-border); color: var(--tmd-fg-muted); white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--tmd-bg-hover); color: var(--tmd-fg); }
  .btn.danger { border-color: rgba(167,139,250,.4); color: var(--bk-reverted); }
  .btn.danger:hover:not(:disabled) { background: rgba(167,139,250,.12); }

  /* 审阅单滚动体 */
  .sheet { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 22px 30px; }
  .sheet-cap { color: var(--tmd-fg-faint); font-size: 11px; margin: 14px 0 8px; }

  /* 用户消息全文卡 */
  .user-full {
    border-left: 2px solid var(--tmd-accent);
    background: var(--tmd-bg-hover);
    border-radius: 0 var(--tmd-radius-sm) var(--tmd-radius-sm) 0;
    padding: 10px 14px;
    color: var(--tmd-fg); line-height: 1.7; font-size: 13px;
    white-space: pre-wrap; word-break: break-word;
  }
  .user-full .meta { color: var(--tmd-fg-faint); font-size: 11px; margin-bottom: 6px; }

  /* 文件分区 */
  .fsec { border: 1px solid var(--tmd-border); border-radius: var(--tmd-radius-sm); margin-bottom: 8px; overflow: hidden; }
  .fsec.flash { animation: sec-flash 1.2s ease; }
  @keyframes sec-flash { 0%, 50% { border-color: var(--tmd-accent); } 100% { border-color: var(--tmd-border); } }
  .fs-head {
    display: flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 10px; cursor: pointer; user-select: none;
    background: var(--tmd-bg-elevated);
  }
  .fs-head:hover { background: var(--tmd-bg-hover); }
  .fs-head .caret { color: var(--tmd-fg-faint); transition: transform .15s; flex: none; }
  .fsec.open .fs-head .caret { transform: rotate(90deg); }
  .fs-head .st { flex: none; width: 15px; height: 15px; border-radius: 4px; display: grid; place-items: center;
    font-size: 10px; font-weight: 700; }
  .fs-head .st.M { background: rgba(250,204,32,.16); color: var(--st-m); }
  .fs-head .st.A { background: rgba(74,222,128,.16); color: var(--st-a); }
  .fs-head .path { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl; text-align: left; font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: var(--tmd-fg); }
  .fs-head .path b { direction: ltr; unicode-bidi: isolate; font-weight: 500; }
  .fs-head .path span { color: var(--tmd-fg-faint); }
  .fs-head .mark { flex: none; font-size: 9.5px; border: 1px dotted var(--tmd-fg-faint);
    border-radius: 4px; padding: 0 4px; line-height: 14px; color: var(--tmd-fg-faint); }
  .fs-head .mark.rv { color: var(--bk-reverted); border-color: var(--bk-reverted); }
  .fs-head .pm { flex: none; font-variant-numeric: tabular-nums; font-size: 10.5px; }
  .fs-head .pm .ins { color: var(--diff-ins); }
  .fs-head .pm .del { color: var(--diff-del); }
  .fs-head .rv1 {
    flex: none; height: 20px; padding: 0 7px; border-radius: 5px;
    display: none; align-items: center; gap: 4px;
    border: 1px solid var(--tmd-border); color: var(--tmd-fg-subtle); font-size: 10.5px;
  }
  .fs-head:hover .rv1 { display: inline-flex; }
  .fs-head .rv1:hover { border-color: rgba(167,139,250,.5); color: var(--bk-reverted); }
  .fs-body { display: none; }
  .fsec.open .fs-body { display: block; }
  .fs-body pre { margin: 0; padding: 7px 10px; overflow-x: auto;
    font-family: "SF Mono", Menlo, monospace; font-size: 10.5px; line-height: 1.6; background: var(--tmd-bg-base); }
  .dl-add { color: var(--diff-ins); background: rgba(46,160,67,.10); display: block; }
  .dl-del { color: var(--diff-del); background: rgba(248,81,73,.10); display: block; }
  .dl-ctx { color: var(--tmd-fg-subtle); display: block; }
  .dl-hnk { color: var(--tmd-accent); opacity: .75; display: block; padding: 4px 0 2px; }
  .dl-end { color: var(--tmd-fg-faint); display: block; padding-top: 6px; }

  /* 空态 */
  .empty { flex: 1; display: grid; place-items: center; color: var(--tmd-fg-faint);
    font-family: -apple-system, "PingFang SC", sans-serif; }

  /* ═══ 右:审批时间线面板 ═══ */
  .apanel {
    width: 348px; flex: none;
    border-left: 1px solid var(--tmd-border);
    background: var(--tmd-bg-base);
    display: flex; flex-direction: column; position: relative;
  }
  .apanel .summary {
    flex: none; display: flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 10px;
    border-bottom: 1px solid var(--tmd-border);
    background: var(--tmd-bg-elevated);
  }
  .apanel .title { display: flex; align-items: center; gap: 6px; font-weight: 600; flex: none; }
  .apanel .title svg { color: var(--tmd-accent); }
  .sess-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 8px 1px 6px; border-radius: 999px;
    background: var(--tmd-accent-soft); color: #7ec3f0; font-weight: 500;
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sess-chip .abbr { font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 4px;
    background: rgba(0,122,204,.32); color: #9fd1f5; flex: none; }
  .apanel .spacer { flex: 1; }
  .wait { color: var(--tmd-fg-muted); white-space: nowrap; flex: none; }
  .wait b { color: var(--bk-pending); font-variant-numeric: tabular-nums; }
  .retention { color: var(--tmd-fg-faint); font-size: 11px; white-space: nowrap; flex: none;
    cursor: help; border-bottom: 1px dotted var(--tmd-fg-faint); }

  .tl { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 8px 12px; }

  .batch { position: relative; margin-bottom: 6px; }
  .batch::before {
    content: ""; position: absolute; left: 15px; top: 24px; bottom: 4px;
    width: 1px; background: var(--tmd-border);
  }
  .batch:last-child::before { display: none; }

  .bk-head {
    position: relative; z-index: 2;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 8px 5px 10px; border-radius: var(--tmd-radius-sm);
    cursor: pointer; user-select: none;
  }
  .bk-head:hover { background: var(--tmd-bg-hover); }
  .bk-head.on { background: var(--tmd-bg-active); }
  .bk-state {
    flex: none; width: 12px; height: 12px; margin-top: 2px; border-radius: 50%;
    background: var(--tmd-bg-base); border: 2px solid var(--tmd-border-strong);
  }
  .bk-state.open { border-color: var(--bk-open); background: var(--bk-open); animation: breathe 1.6s ease infinite; }
  .bk-state.pending { border-color: var(--bk-pending); background: var(--bk-pending); }
  .bk-state.reverted { border-color: var(--bk-reverted); background: var(--bk-reverted); }
  .bk-state.done { border-color: var(--bk-done); background: transparent; }

  .bk-main { flex: 1; min-width: 0; }
  .bk-l1 { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
  .bk-l1 .no { color: var(--tmd-fg-faint); font-variant-numeric: tabular-nums; flex: none; }
  .bk-l1 .prompt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tmd-fg); }
  .batch.dimmed .bk-l1 .prompt { color: var(--tmd-fg-faint); text-decoration: line-through; }
  .bk-l1 .go { margin-left: auto; flex: none; color: transparent; font-size: 10.5px; transition: color .12s; }
  .bk-head:hover .go, .bk-head.on .go { color: var(--tmd-accent); }
  .bk-l2 { display: flex; gap: 6px; align-items: center; color: var(--tmd-fg-faint); font-size: 11px;
    white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .bk-l2 .ins { color: var(--diff-ins); }
  .bk-l2 .del { color: var(--diff-del); }
  .bk-l2 .when { margin-left: auto; flex: none; }

  .badge { flex: none; padding: 0 6px; border-radius: 999px; font-size: 9.5px; line-height: 15px; font-weight: 600; }
  .badge.pending { background: rgba(250,204,32,.14); color: var(--bk-pending); }
  .badge.reverted { background: rgba(167,139,250,.16); color: var(--bk-reverted); }
  .badge.open { background: var(--tmd-accent-soft); color: #7ec3f0; }
  .badge.done { background: rgba(154,157,160,.14); color: var(--bk-done); }

  .files { margin: 1px 0 3px 32px; }
  .frow {
    display: flex; align-items: center; gap: 7px;
    height: 25px; padding: 0 7px; border-radius: var(--tmd-radius-sm);
    color: var(--tmd-fg-muted); cursor: pointer;
  }
  .frow:hover { background: var(--tmd-bg-hover); color: var(--tmd-fg); }
  .frow .st { flex: none; width: 14px; height: 14px; border-radius: 4px; display: grid; place-items: center;
    font-size: 9.5px; font-weight: 700; }
  .frow .st.M { background: rgba(250,204,32,.16); color: var(--st-m); }
  .frow .st.A { background: rgba(74,222,128,.16); color: var(--st-a); }
  .frow .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left; font-family: "SF Mono", Menlo, monospace; font-size: 11px; }
  .frow .fname b { direction: ltr; unicode-bidi: isolate; font-weight: 500; }
  .frow .fname span { color: var(--tmd-fg-faint); }
  .frow .stale { flex: none; font-size: 9.5px; color: var(--tmd-fg-faint);
    border: 1px dotted var(--tmd-fg-faint); border-radius: 4px; padding: 0 4px; line-height: 14px; }
  .frow .pm { flex: none; font-variant-numeric: tabular-nums; font-size: 10.5px; }
  .frow .pm .ins { color: var(--diff-ins); }
  .frow .pm .del { color: var(--diff-del); }
  .frow .act { flex: none; width: 19px; height: 19px; border-radius: 5px;
    display: none; place-items: center; color: var(--tmd-fg-subtle); }
  .frow:hover .act { display: grid; }
  .frow .act:hover { background: rgba(167,139,250,.18); color: var(--bk-reverted); }

  .bk-foot { display: flex; align-items: center; gap: 6px; margin: 2px 0 8px 32px; }
  .bk-foot .note { color: var(--tmd-fg-faint); font-size: 10.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bk-foot .mini {
    height: 21px; padding: 0 8px; border-radius: 5px; flex: none;
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--tmd-border); color: var(--tmd-fg-subtle); font-size: 10.5px;
  }
  .bk-foot .mini:hover { background: var(--tmd-bg-hover); color: var(--tmd-fg); }
  .bk-foot .mini.danger:hover { border-color: rgba(167,139,250,.5); color: var(--bk-reverted); }

  .tl-gap {
    display: flex; align-items: center; gap: 7px;
    margin: 8px 4px 10px; padding: 0 8px;
    color: var(--tmd-fg-faint); font-size: 10.5px;
  }
  .tl-gap::before, .tl-gap::after { content: ""; flex: 1; height: 1px; background: var(--tmd-border); }
  .batch.readonly .bk-l1 .prompt, .batch.readonly .bk-l2 { opacity: .55; }

  /* ── 回退确认 popover ── */
  .confirm {
    position: absolute; right: 10px; z-index: 40;
    width: 300px; padding: 10px 12px;
    background: var(--tmd-bg-popover); border: 1px solid var(--tmd-border-strong);
    border-radius: var(--tmd-radius-md);
    box-shadow: 0 12px 36px rgba(0,0,0,.5);
  }
  .confirm h4 { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .confirm .sub { color: var(--tmd-fg-muted); font-size: 11px; line-height: 1.55; margin-bottom: 8px; }
  .confirm .sub .guard { color: var(--bk-done); }
  .confirm .files {
    max-height: 90px; overflow-y: auto; margin-bottom: 8px;
    border: 1px solid var(--tmd-border); border-radius: var(--tmd-radius-sm); padding: 3px 7px;
  }
  .confirm .files div {
    font-family: "SF Mono", Menlo, monospace; font-size: 10.5px;
    color: var(--tmd-fg-muted); padding: 1.5px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .confirm .row { display: flex; gap: 6px; justify-content: flex-end; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: 999px;
    background: var(--tmd-bg-popover); border: 1px solid var(--tmd-border-strong);
    color: var(--tmd-fg); font-size: 12px;
    box-shadow: 0 10px 32px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .toast .rv { color: var(--bk-reverted); }
</style>
</head>
<body>

<div class="demo-badge">方案 <b>D v4 · 审批时间线 × 批审阅单</b> ｜ 点批次/文件 → 中央「用户消息 + 该轮文件 diff」审阅单，一批一个 tab</div>

<div class="window">
  <div class="titlebar">
    <span class="dots"><i></i><i></i><i></i></span>
    tmd-cli ⌄ &nbsp;·&nbsp; 中央 = 批审阅单(用户消息 + 文件 diff 列表) · 时间线点文件深链到对应分区
  </div>
  <div class="body">
    <div class="sidebar">
      <div class="ws active">📁 tmd-cli</div>
      <div class="sess on">● omp · 网络代理插件</div>
      <div class="sess">○ claude · 修复翻页锚点</div>
      <div class="sess">○ pi · 插件市场设计</div>
      <div class="ws" style="margin-top:10px">📁 codemoss</div>
      <div class="sess">○ omp · 锚点栏调研</div>
    </div>

    <!-- 中央编辑区 -->
    <div class="stage">
      <div class="tabbar" id="tabbar"></div>
      <div id="viewHost" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
    </div>

    <!-- 右:审批时间线 -->
    <div class="apanel" id="apanel">
      <div class="summary">
        <span class="title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          审批线
        </span>
        <span class="sess-chip"><span class="abbr">omp</span>网络代理插件</span>
        <span class="spacer"></span>
        <span class="wait">待审 <b>2</b></span>
        <span class="retention" title="每会话保留最近 100 批快照，超期 30 天清理；回退前自动打恢复点">100/会话 · 30 天</span>
      </div>

      <div class="tl" id="tl"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── 与 A/B/C 原型同叙事:omp · 网络代理插件会话 ──
   状态机:open → pending → reverted | done(自动:已提交/内容已变)
   中央「批审阅单」= 用户消息全文 + 该轮文件 diff 分区列表 */
const BATCHES = [
  { no: 6, state: "open", when: "刚刚", prompt:
      "代理挂掉时给个明确的错误提示吧。现在 spawn 失败和上游超时都报同一个 ECONNREFUSED,分不开。\n把错误码在 spawn 侧就分类,UI 只认枚举;提示文案要带上游地址,方便一眼定位是本地端口冲突还是上游挂了。",
    files: [{ st: "M", name: "proxy.rs", dir: "src-tauri/src/", ins: 38, del: 6 }] },
  { no: 5, state: "pending", when: "2 分钟前", prompt:
      "把代理设置挂到设置面板里,新增一个分区。要求:\n1) settings.ts 里加 ProxySettings 接口,port 默认 0 表示随机可用端口,upstream 为空表示直连;\n2) sanitize 做字段清洗,非法端口回退默认,别让手改 config 把布局搞炸;\n3) SidebarSettingsCluster 按现有 pref-card/pref-row 样式出分区,零新增 CSS;\n4) 测试补齐回退默认的用例。",
    files: [
      { st: "M", name: "settings.ts", dir: "src/kernel/", ins: 54, del: 3,
        diff: [
          ["ctx", " export interface AppSettings {"],
          ["add", "   proxy: ProxySettings;        // 新增:网络代理分区"],
          ["ctx", "   disabledPlugins: string[];"],
          ["ctx", " }"],
          ["ctx", ""],
          ["add", " export interface ProxySettings {"],
          ["add", "   port: number;                // 0 = 随机可用端口"],
          ["add", "   upstream: string;            // 显式上游,空 = 直连"],
          ["del", " export interface LegacyProxyConf {"],
          ["del", "   legacyPortField: string;     // 旧字段,迁入 ProxySettings"],
          ["ctx", ""],
          ["add", " export function sanitizeProxy(p: unknown): ProxySettings {"],
          ["add", "   // 非法端口回退 0;upstream 仅允许 http(s):// 前缀"],
          ["ctx", "   return { ...DEFAULT_PROXY, ...pickValid(p) };"] ] },
      { st: "M", name: "settings.test.ts", dir: "src/kernel/", ins: 31, del: 0 },
      { st: "M", name: "SidebarSettingsCluster.tsx", dir: "src/app-shell/", ins: 88, del: 12,
        diff: [
          ["ctx", " const CLUSTERS: SettingsSectionContribution[] = ["],
          ["add", "   { id: \"proxy\", label: \"网络代理\", component: ProxySection },"],
          ["ctx", "   { id: \"quota\", label: \"额度\", component: QuotaSection },"],
          ["ctx", " ];" ] ] },
    ] },
  { no: 4, state: "pending", when: "8 分钟前", prompt:
      "sanitize 加上 proxy 字段清洗:port clamp 到 0-65535,upstream 仅允许 http(s):// 前缀,非法值回退默认。settings.test.ts 补对应用例,注意别把合法的 0 端口误伤。",
    files: [
      { st: "M", name: "settings.ts", dir: "src/kernel/", ins: 22, del: 4, stale: "内容已变" },
      { st: "M", name: "settings.test.ts", dir: "src/kernel/", ins: 18, del: 0 },
    ] },
  { no: 3, state: "done", doneReason: "已提交", when: "昨天 21:40", prompt:
      "提交逻辑挪到 proxyCommit.ts,别混在组件里。ProxyPopover 里 setState 和 commit 命令绞在一起,拆成纯函数 + 测试,组件只留交互。",
    files: [
      { st: "A", name: "proxyCommit.ts", dir: "src/plugins/network-proxy/", ins: 112, del: 0 },
      { st: "M", name: "index.tsx", dir: "src/plugins/network-proxy/", ins: 12, del: 64 },
      { st: "A", name: "proxyCommit.test.ts", dir: "src/plugins/network-proxy/", ins: 47, del: 0 },
    ] },
  { no: 2, state: "reverted", when: "昨天 21:12", prompt:
      "顺手把 Cargo.toml 的 reqwest 降到 0.12 吧,听说 0.13 的 rustls 默认后端在老系统上有问题。",
    files: [{ st: "M", name: "Cargo.toml", dir: "src-tauri/", ins: 2, del: 2 }] },
  /* resume 断档线以下:上一段运行的批,只读 */
  { no: 1, state: "done", doneReason: "已提交", when: "09-01 22:31", prompt:
      "proxy 子模块起个头:先跑通 spawn 生命周期,子进程挂死要有兜底 kill。lib.rs 挂上命令注册,别忘了 windowsHide。",
    readonly: true,
    files: [
      { st: "A", name: "proxy.rs", dir: "src-tauri/src/", ins: 214, del: 0 },
      { st: "M", name: "lib.rs", dir: "src-tauri/src/", ins: 9, del: 1 },
    ] },
];

const STATE_TEXT = { open: "进行中", pending: "待审", reverted: "已退", done: "已处理" };
let tabs = [];            /* [{key:"batch:no", batch}] —— 一批一个 tab */
let activeTab = null;

const tl = document.getElementById("tl");
const tabbar = document.getElementById("tabbar");
const viewHost = document.getElementById("viewHost");

function stat(b) {
  return { ins: b.files.reduce((s, f) => s + f.ins, 0), del: b.files.reduce((s, f) => s + f.del, 0) };
}
function badgeOf(b) {
  if (b.state === "done") return `<span class="badge done">已处理 · ${b.doneReason}</span>`;
  return `<span class="badge ${b.state}">${STATE_TEXT[b.state]}</span>`;
}
function updateWait() {
  document.querySelector(".wait b").textContent =
    BATCHES.filter(b => !b.readonly && b.state === "pending").length;
}
function revertable(b) { return b.files.filter(f => !f.stale && !f.rv); }

/* ── 右栏时间线 ── */
function renderTL() {
  updateWait();
  tl.innerHTML = "";
  BATCHES.forEach(b => {
    if (b.no === 1) {
      const gap = document.createElement("div");
      gap.className = "tl-gap";
      gap.textContent = "↳ 会话 resume · 09-01 22:14 · 断档前只读";
      tl.appendChild(gap);
    }
    const s = stat(b);
    const on = activeTab === "batch:" + b.no;
    const el = document.createElement("div");
    el.className = "batch" + (b.state === "reverted" ? " dimmed" : "") + (b.readonly ? " readonly" : "");

    /* 批头:点击 → 中央批审阅单 */
    const head = document.createElement("div");
    head.className = "bk-head" + (on ? " on" : "");
    head.innerHTML = `
      <span class="bk-state ${b.state}"></span>
      <span class="bk-main">
        <span class="bk-l1"><span class="no">#${b.no}</span><span class="prompt">${esc(b.prompt.split("\n")[0])}</span><span class="go">审阅 ›</span></span>
        <span class="bk-l2"><span>${b.files.length} 文件</span>
          <span><span class="ins">+${s.ins}</span> <span class="del">−${s.del}</span></span>
          ${badgeOf(b)}<span class="when">${b.when}</span></span>
      </span>`;
    head.title = "点击审阅该批(用户消息 + 文件 diff)";
    head.addEventListener("click", () => openBatch(b));
    el.appendChild(head);

    /* 文件行:点击 → 深链到审阅单对应分区 */
    const files = document.createElement("div");
    files.className = "files";
    b.files.forEach(f => {
      const row = document.createElement("div");
      row.className = "frow";
      row.innerHTML = `
        <span class="st ${f.st}">${f.st}</span>
        <span class="fname"><b>${esc(f.name)}</b> <span>${esc(f.dir)}</span></span>
        ${f.rv ? `<span class="stale" style="color:var(--bk-reverted);border-color:var(--bk-reverted)" title="该文件已单独回退">已退</span>` : ""}
        ${f.stale ? `<span class="stale" title="工作区当前内容已偏离本批后像(手改/后续改动),该文件不可回退">${f.stale}</span>` : ""}
        <span class="pm"><span class="ins">+${f.ins}</span> <span class="del">−${f.del}</span></span>
        ${b.state === "pending" && !f.stale && !f.rv ? `<button class="act" title="只回退这个文件">↩</button>` : ""}`;
      row.addEventListener("click", e => {
        if (e.target.closest(".act")) { confirmRevert(el, b, [f], true); return; }
        openBatch(b, f);
      });
      files.appendChild(row);
    });
    el.appendChild(files);

    const foot = document.createElement("div");
    foot.className = "bk-foot";
    if (b.state === "pending") {
      const rv = revertable(b);
      if (rv.length) {
        foot.innerHTML = `<button class="mini danger">↩ 回退整批(${rv.length} 文件)</button>
          <span class="note">回退前自动打恢复点</span>`;
        foot.querySelector(".mini").addEventListener("click", e => {
          e.stopPropagation();
          confirmRevert(el, b, rv, false);
        });
      } else {
        foot.innerHTML = `<span class="note" style="color:var(--bk-reverted)">全部文件已单独处理 —— 本批视为已退</span>`;
      }
    } else if (b.state === "reverted") {
      foot.innerHTML = `<span class="note" style="color:var(--bk-reverted)">已回退(恢复点 #g8 留存)</span>
        <button class="mini">↩ 反悔 · 恢复回来</button>`;
      foot.querySelector(".mini").addEventListener("click", () => {
        b.state = "pending";
        toast(`批次 #${b.no} 已从恢复点 #g8 恢复,回到「待审」`, "rv");
        renderAll();
      });
    } else if (b.state === "done") {
      foot.innerHTML = `<span class="note">${b.doneReason === "已提交" ? "文件已随你的提交进入 git,自动已处理" : "工作区内容已偏离批次后像,自动已处理"} —— 无需操作</span>`;
    } else { /* open */
      foot.innerHTML = `<span class="note">进行中 —— 下一条消息发出时自动封口进入待审</span>`;
    }
    el.appendChild(foot);

    tl.appendChild(el);
  });
}

/* ── 中央:批审阅单(一批一个 tab)── */
function openBatch(b, focusFile) {
  const key = "batch:" + b.no;
  if (!tabs.some(t => t.key === key)) tabs.push({ key, batch: b });
  activeTab = key;
  renderTabs(); renderSheet(b, focusFile); renderTL();
}
function closeTab(key) {
  tabs = tabs.filter(t => t.key !== key);
  if (activeTab === key) activeTab = tabs.length ? tabs[tabs.length - 1].key : null;
  renderTabs();
  if (activeTab) renderSheet(tabs.find(t => t.key === activeTab).batch); else viewHost.innerHTML = `<div class="empty">从右侧审批线点批次或文件,在这里审阅该轮改动</div>`;
  renderTL();
}

function renderTabs() {
  tabbar.innerHTML = "";
  tabs.forEach(t => {
    const tab = document.createElement("div");
    tab.className = "tab" + (t.key === activeTab ? " active" : "");
    tab.innerHTML = `<span class="bd ${t.batch.state}"></span>
      <span style="overflow:hidden;text-overflow:ellipsis">批次 #${t.batch.no}</span>
      <span class="x" title="关闭">×</span>`;
    tab.addEventListener("click", e => {
      if (e.target.closest(".x")) { closeTab(t.key); return; }
      activeTab = t.key; renderTabs(); renderSheet(t.batch); renderTL();
    });
    tabbar.appendChild(tab);
  });
}

function renderSheet(b, focusFile) {
  viewHost.innerHTML = "";
  const s = stat(b);

  const bar = document.createElement("div");
  bar.className = "view-bar";
  bar.innerHTML = `
    <span class="ctx">批次 #${b.no} · ${STATE_TEXT[b.state]}${b.state === "done" ? " · " + b.doneReason : ""} · ${esc(b.when)} · omp</span>
    <span class="pm"><span class="ins">+${s.ins}</span> <span class="del">−${s.del}</span></span>
    <span class="spacer"></span>
    ${b.state === "pending" && revertable(b).length ? `<button class="btn danger">↩ 回退整批(${revertable(b).length} 文件)</button>` : ""}
    ${b.readonly ? `<span class="ctx">断档前 · 只读</span>` : ""}`;
  const rvAll = bar.querySelector(".danger");
  if (rvAll) rvAll.addEventListener("click", () => confirmRevert(document.getElementById("apanel"), b, revertable(b), false));
  viewHost.appendChild(bar);

  const sheet = document.createElement("div");
  sheet.className = "sheet";

  /* 1. 用户消息全文 */
  const cap1 = document.createElement("div");
  cap1.className = "sheet-cap";
  cap1.textContent = "用户消息 · " + b.when;
  sheet.appendChild(cap1);
  const uf = document.createElement("div");
  uf.className = "user-full";
  uf.innerHTML = `<div class="meta">你</div>${esc(b.prompt)}`;
  sheet.appendChild(uf);

  /* 2. AI 修改的文件列表(分区 + diff) */
  const cap2 = document.createElement("div");
  cap2.className = "sheet-cap";
  cap2.textContent = `AI 修改的文件(${b.files.length}) —— 点击分区头折叠;hover 可单文件回退`;
  sheet.appendChild(cap2);

  b.files.forEach(f => {
    const sec = document.createElement("div");
    sec.className = "fsec open";
    sec.dataset.file = f.dir + f.name;
    const canRv = b.state === "pending" && !f.stale && !f.rv;
    sec.innerHTML = `
      <div class="fs-head">
        <span class="caret">›</span>
        <span class="st ${f.st}">${f.st}</span>
        <span class="path"><b>${esc(f.name)}</b> <span>${esc(f.dir)}</span></span>
        ${f.rv ? `<span class="mark rv">已退</span>` : ""}
        ${f.stale ? `<span class="mark" title="工作区当前内容已偏离本批后像,不可回退">${f.stale}</span>` : ""}
        <span class="pm"><span class="ins">+${f.ins}</span> <span class="del">−${f.del}</span></span>
        ${canRv ? `<button class="rv1">↩ 只回退此文件</button>` : ""}
      </div>
      <div class="fs-body">${
        f.diff
        ? `<pre><span class="dl-hnk">@@ -42,7 +42,${f.ins + 9} @@ ${esc(f.dir + f.name)}</span>${
            f.diff.map(([k, t]) => `<span class="dl-${k}">${k === "add" ? "+" : k === "del" ? "−" : " "} ${esc(t)}</span>`).join("")
          }<span class="dl-end">—— 区间外已折叠 · 完整渲染走 patch LRU ——</span></pre>`
        : `<pre><span class="dl-end">(${f.ins} 行变更 —— 演示数据省略展开,渲染同上)</span></pre>`
      }</div>`;
    sec.querySelector(".fs-head").addEventListener("click", e => {
      if (e.target.closest(".rv1")) return;
      sec.classList.toggle("open");
    });
    const rv1 = sec.querySelector(".rv1");
    if (rv1) rv1.addEventListener("click", () => confirmRevert(document.getElementById("apanel"), b, [f], true));
    sheet.appendChild(sec);
  });

  viewHost.appendChild(sheet);
  sheet.scrollTop = 0;

  /* 深链:滚动到目标文件分区并高亮 */
  if (focusFile) {
    const target = sheet.querySelector(`[data-file="${CSS.escape(focusFile.dir + focusFile.name)}"]`);
    if (target) {
      target.classList.add("open", "flash");
      target.scrollIntoView({ block: "center" });
      setTimeout(() => target.classList.remove("flash"), 1300);
    }
  }
}

/* ── 回退确认 popover ── */
function confirmRevert(host, b, files, single) {
  document.querySelectorAll(".confirm").forEach(n => n.remove());
  const pop = document.createElement("div");
  pop.className = "confirm";
  pop.style.top = "120px";
  pop.innerHTML = `
    <h4>回退${single ? "文件" : `批次 #${b.no}`}(${files.length} 个路径)</h4>
    <div class="sub">改动将还原到这轮消息发出之前。<span class="guard">回退前已自动打恢复点 #g9,反悔可再回来。</span>
      当前内容与批次后像不一致的文件会被跳过,绝不静默覆盖。</div>
    <div class="files">${files.map(f => `<div>${esc(f.dir + f.name)}　<span style="color:var(--diff-ins)">+${f.ins}</span> <span style="color:var(--diff-del)">−${f.del}</span></div>`).join("")}</div>
    <div class="row">
      <button class="btn">取消</button>
      <button class="btn danger">确认回退</button>
    </div>`;
  pop.querySelector(".btn").addEventListener("click", () => pop.remove());
  pop.querySelectorAll(".btn")[1].addEventListener("click", () => {
    if (single) {
      files.forEach(f => { f.rv = true; });
      if (b.files.every(f => f.rv || f.stale)) b.state = "reverted";
      pop.remove();
      toast(`已回退 1 个文件 · 批次 #${b.no} 仍在待审(恢复点 #g9 留存)`, "rv");
    } else {
      b.state = "reverted";
      pop.remove();
      toast(`批次 #${b.no} 已回退(${files.length} 文件)· 恢复点 #g9 留存`, "rv");
    }
    renderAll();
  });
  host.appendChild(pop);
}

function renderAll() {
  renderTL(); renderTabs();
  if (activeTab) renderSheet(tabs.find(t => t.key === activeTab).batch);
  else viewHost.innerHTML = `<div class="empty">从右侧审批线点批次或文件,在这里审阅该轮改动</div>`;
}

let toastTimer = 0;
function toast(msg, tone) {
  const t = document.getElementById("toast");
  t.innerHTML = `<span class="${tone}">●</span>${esc(msg)}`;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function esc(s) { return s.replace(/</g, "&lt;"); }

/* 初始演示:打开待审批 #5 的审阅单 */
renderAll();
openBatch(BATCHES.find(b => b.no === 5));
</script>
</body>
</html>
