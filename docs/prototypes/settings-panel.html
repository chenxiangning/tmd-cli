<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tmd-cli 设置面板原型 — 基础设置 / 外观 / 主题</title>
<style>
  /* ═══════════════════════════════════════════════════════
     全部颜色来自 design-tokens.md 的 --tmd-* 变量。
     默认 light/dark 由 data-theme 静态给出;
     custom 由 JS 按 preset 内联覆盖到 <html>。
     ═══════════════════════════════════════════════════════ */
  :root[data-theme="light"] {
    --tmd-bg-base: #ffffff; --tmd-bg-elevated: #f8f8f8; --tmd-bg-sunken: #f8f8f8;
    --tmd-bg-hover: #f2f2f2; --tmd-bg-active: rgba(0,95,184,.14);
    --tmd-bg-input: #ffffff; --tmd-bg-popover: #f8f8f8;
    --tmd-fg: #3b3b3b; --tmd-fg-muted: #6e6e6e; --tmd-fg-subtle: #8a8a8a; --tmd-fg-faint: #a6a6a6;
    --tmd-border: #cecece; --tmd-border-strong: #a3a3a3;
    --tmd-accent: #005fb8; --tmd-accent-fg: #ffffff; --tmd-accent-soft: rgba(0,95,184,.14);
  }
  :root[data-theme="dark"] {
    --tmd-bg-base: #1f1f1f; --tmd-bg-elevated: #181818; --tmd-bg-sunken: #181818;
    --tmd-bg-hover: #2a2a2a; --tmd-bg-active: rgba(0,122,204,.24);
    --tmd-bg-input: #313131; --tmd-bg-popover: #252526;
    --tmd-fg: #cccccc; --tmd-fg-muted: #9d9d9d; --tmd-fg-subtle: #7a7a7a; --tmd-fg-faint: #585858;
    --tmd-border: #3c3c3c; --tmd-border-strong: #555555;
    --tmd-accent: #007acc; --tmd-accent-fg: #ffffff; --tmd-accent-soft: rgba(0,122,204,.24);
  }
  :root {
    --tmd-font-ui: 12px; --tmd-font-title: 20px;
    --tmd-radius-sm: 6px; --tmd-radius-md: 8px; --tmd-radius-lg: 12px;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: var(--tmd-font-ui)/1.5 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    background: var(--tmd-bg-base);
    color: var(--tmd-fg);
    display: flex;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  svg { display: block; }

  /* ── 左侧导航 ── */
  .settings-nav {
    width: 208px; flex: 0 0 208px;
    background: var(--tmd-bg-elevated);
    border-right: 1px solid var(--tmd-border);
    display: flex; flex-direction: column;
    padding: 12px 8px; gap: 2px;
  }
  .settings-back {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; margin-bottom: 10px;
    border-radius: var(--tmd-radius-sm);
    color: var(--tmd-fg-muted);
  }
  .settings-back:hover { background: var(--tmd-bg-hover); color: var(--tmd-fg); }
  .settings-nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px;
    border-radius: var(--tmd-radius-sm);
    color: var(--tmd-fg-muted);
    text-align: left; width: 100%;
  }
  .settings-nav-item:hover { background: var(--tmd-bg-hover); }
  .settings-nav-item.is-active {
    background: var(--tmd-bg-active);
    color: var(--tmd-fg);
    font-weight: 600;
  }

  /* ── 右侧内容 ── */
  .settings-main { flex: 1; overflow-y: auto; background: var(--tmd-bg-base); }
  .settings-content { max-width: 860px; margin: 0 auto; padding: 36px 40px 64px; }
  .settings-title { font-size: var(--tmd-font-title); font-weight: 700; }
  .settings-subtitle { color: var(--tmd-fg-muted); margin-top: 4px; }

  .settings-tabs {
    display: flex; gap: 4px; margin-top: 24px;
    border-bottom: 1px solid var(--tmd-border);
  }
  .settings-tab {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; margin-bottom: -1px;
    color: var(--tmd-fg-muted);
    border-bottom: 2px solid transparent;
    border-radius: var(--tmd-radius-sm) var(--tmd-radius-sm) 0 0;
  }
  .settings-tab:hover { color: var(--tmd-fg); background: var(--tmd-bg-hover); }
  .settings-tab.is-active { color: var(--tmd-fg); border-bottom-color: var(--tmd-accent); font-weight: 600; }

  /* ── pref 卡片 ── */
  .pref-card {
    margin-top: 20px;
    border: 1px solid var(--tmd-border);
    border-radius: var(--tmd-radius-md);
    background: var(--tmd-bg-elevated);
  }
  .pref-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; padding: 14px 16px;
  }
  .pref-row + .pref-row { border-top: 1px solid var(--tmd-border); }
  .pref-title { font-weight: 600; }
  .pref-desc { color: var(--tmd-fg-muted); margin-top: 2px; }

  .segmented {
    display: flex; gap: 2px;
    background: var(--tmd-bg-input);
    border: 1px solid var(--tmd-border);
    border-radius: var(--tmd-radius-md);
    padding: 2px;
  }
  .segment {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px;
    border-radius: var(--tmd-radius-sm);
    color: var(--tmd-fg-muted);
    white-space: nowrap;
  }
  .segment:hover { color: var(--tmd-fg); }
  .segment.is-active { background: var(--tmd-bg-active); color: var(--tmd-fg); font-weight: 600; }

  /* ── preset 网格 ── */
  .preset-section { display: none; padding: 14px 16px; border-top: 1px solid var(--tmd-border); }
  .pref-card.is-custom .preset-section { display: block; }
  .preset-group-label { color: var(--tmd-fg-muted); font-weight: 600; margin: 8px 0 8px; }
  .preset-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 10px;
  }
  .preset-card {
    border: 1px solid var(--tmd-border);
    border-radius: var(--tmd-radius-md);
    overflow: hidden;
    text-align: left;
    background: var(--tmd-bg-base);
    padding: 0;
  }
  .preset-card:hover { border-color: var(--tmd-border-strong); }
  .preset-card.is-active { border-color: var(--tmd-accent); box-shadow: 0 0 0 1px var(--tmd-accent); }
  .preset-thumb { height: 64px; display: flex; }
  .preset-thumb-side { width: 30%; display: flex; flex-direction: column; }
  .preset-thumb-side span { flex: 1; }
  .preset-thumb-main { flex: 1; display: flex; flex-direction: column; padding: 8px; gap: 4px; }
  .preset-thumb-main i { height: 6px; border-radius: 3px; display: block; }
  .preset-name { padding: 6px 10px; color: var(--tmd-fg-muted); display: flex; align-items: center; justify-content: space-between; }
  .preset-card.is-active .preset-name { color: var(--tmd-fg); font-weight: 600; }
  .preset-check { color: var(--tmd-accent); visibility: hidden; }
  .preset-card.is-active .preset-check { visibility: visible; }

  /* ── 迷你应用预览 ── */
  .app-preview {
    margin-top: 20px;
    border: 1px solid var(--tmd-border);
    border-radius: var(--tmd-radius-lg);
    overflow: hidden;
  }
  .app-preview-titlebar {
    height: 30px; display: flex; align-items: center; gap: 6px;
    background: var(--tmd-bg-sunken);
    border-bottom: 1px solid var(--tmd-border);
    padding: 0 10px;
  }
  .app-preview-titlebar .dot { width: 9px; height: 9px; border-radius: 50%; }
  .app-preview-titlebar .crumb { color: var(--tmd-fg-subtle); margin-left: 8px; }
  .app-preview-body { display: flex; height: 150px; }
  .app-preview-sidebar {
    width: 30%; background: var(--tmd-bg-elevated);
    border-right: 1px solid var(--tmd-border);
    padding: 8px; display: flex; flex-direction: column; gap: 5px;
  }
  .app-preview-sidebar .row { height: 14px; border-radius: var(--tmd-radius-sm); }
  .app-preview-canvas { flex: 1; background: var(--tmd-bg-base); padding: 10px; display: flex; flex-direction: column; gap: 5px; }
  .app-preview-canvas .line { height: 7px; border-radius: 3px; }
  .app-preview-composer {
    margin: 0 10px 10px; height: 26px;
    background: var(--tmd-bg-input); border: 1px solid var(--tmd-border);
    border-radius: var(--tmd-radius-md);
    display: flex; align-items: center; padding: 0 10px;
    color: var(--tmd-fg-faint);
  }
  .proto-note {
    position: fixed; right: 12px; bottom: 10px;
    color: var(--tmd-fg-faint); font-size: 11px;
  }
</style>
</head>
<body>
  <!-- 左侧导航:只渲染已注册 section(一期 = 基础设置) -->
  <nav class="settings-nav">
    <button class="settings-back" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      返回应用
    </button>
    <button class="settings-nav-item is-active" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      基础设置
    </button>
  </nav>

  <!-- 右侧内容 -->
  <main class="settings-main">
    <div class="settings-content">
      <h1 class="settings-title">基础设置</h1>
      <p class="settings-subtitle">外观、行为和环境的基础配置。</p>

      <div class="settings-tabs" role="tablist">
        <button class="settings-tab is-active" type="button" role="tab" aria-selected="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          外观
        </button>
      </div>

      <!-- 主题 -->
      <div class="pref-card" id="theme-card">
        <div class="pref-row">
          <div>
            <div class="pref-title">主题</div>
            <div class="pref-desc" id="theme-hint">当前跟随系统外观。</div>
          </div>
          <div class="segmented" role="radiogroup" aria-label="主题" id="theme-segmented">
            <button class="segment" type="button" role="radio" data-mode="system">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
              跟随系统
            </button>
            <button class="segment" type="button" role="radio" data-mode="light">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
              浅色
            </button>
            <button class="segment" type="button" role="radio" data-mode="dark">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              深色
            </button>
            <button class="segment" type="button" role="radio" data-mode="custom">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
              自定义
            </button>
          </div>
        </div>

        <!-- 自定义 preset 网格(选中「自定义」时展开) -->
        <div class="preset-section" id="preset-section"></div>
      </div>

      <!-- 迷你应用预览:验证 token 对主外壳的覆盖 -->
      <div class="app-preview" aria-label="应用外观预览">
        <div class="app-preview-titlebar">
          <span class="dot" style="background:#ff5f57"></span>
          <span class="dot" style="background:#febc2e"></span>
          <span class="dot" style="background:#28c840"></span>
          <span class="crumb">tmd-cli / workspace / session</span>
        </div>
        <div class="app-preview-body">
          <div class="app-preview-sidebar">
            <div class="row" style="background:var(--tmd-bg-active)"></div>
            <div class="row" style="background:var(--tmd-bg-hover)"></div>
            <div class="row" style="background:var(--tmd-bg-hover); width:70%"></div>
          </div>
          <div class="app-preview-canvas">
            <div class="line" style="background:var(--tmd-fg); width:60%"></div>
            <div class="line" style="background:var(--tmd-fg-muted); width:85%"></div>
            <div class="line" style="background:var(--tmd-accent); width:35%"></div>
            <div class="line" style="background:var(--tmd-fg-subtle); width:50%"></div>
          </div>
        </div>
        <div class="app-preview-composer" style="margin:10px">输入消息,Enter 发送…</div>
      </div>
    </div>
  </main>

  <span class="proto-note">settings-panel 原型 · 交互真实可用,选择持久化到 localStorage</span>

<script>
(() => {
  /* ── 颜色工具(与实现版 kernel/themeTokens.ts 同算法) ── */
  const norm = (hex) => {
    if (typeof hex !== "string") return null;
    let h = hex.trim().replace(/^#/, "");
    if (/^[0-9a-f]{3}$/i.test(h)) h = h.split("").map((c) => c + c).join("");
    return /^[0-9a-f]{6}$/i.test(h) ? "#" + h.toLowerCase() : null;
  };
  const rgb = (hex) => { const h = norm(hex) || "#000000"; return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; };
  const toHex = (v) => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, "0");
  const mix = (a, b, t) => { const [r1, g1, b1] = rgb(a); const [r2, g2, b2] = rgb(b); return `#${toHex(r1 + (r2 - r1) * t)}${toHex(g1 + (g2 - g1) * t)}${toHex(b1 + (b2 - b1) * t)}`; };
  const alpha = (hex, a) => { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; };
  const contrast = (hex) => { const [r, g, b] = rgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.5 ? "#1f1f1f" : "#ffffff"; };

  /* ── preset colors → --tmd-* tokens(映射规则同 codemoss mapVsCodeColorsToTokens) ── */
  function tokensFromPreset(p) {
    const c = p.colors, dark = p.appearance === "dark";
    const get = (k, fb) => norm(c[k]) || fb;
    const bgBase = get("editor.background", dark ? "#1e1e1e" : "#ffffff");
    const fg = get("foreground", get("editor.foreground", dark ? "#d4d4d4" : "#1f1f1f"));
    const bgElevated = get("sideBar.background", mix(bgBase, dark ? "#000000" : "#ffffff", dark ? 0.12 : 0.04));
    const bgSunken = get("titleBar.activeBackground", get("statusBar.background", bgElevated));
    const border = get("input.border", get("dropdown.border", get("panel.border", mix(bgElevated, fg, dark ? 0.16 : 0.14))));
    const accent = get("button.background", get("textLink.foreground", dark ? "#007acc" : "#005fb8"));
    return {
      "--tmd-bg-base": bgBase,
      "--tmd-bg-elevated": bgElevated,
      "--tmd-bg-sunken": bgSunken,
      "--tmd-bg-hover": get("list.hoverBackground", mix(bgElevated, dark ? "#ffffff" : "#000000", dark ? 0.06 : 0.04)),
      "--tmd-bg-active": alpha(accent, dark ? 0.24 : 0.14),
      "--tmd-bg-input": get("input.background", get("dropdown.background", bgElevated)),
      "--tmd-bg-popover": get("dropdown.background", get("editorWidget.background", bgElevated)),
      "--tmd-fg": fg,
      "--tmd-fg-muted": mix(fg, bgBase, 0.34),
      "--tmd-fg-subtle": mix(fg, bgBase, 0.48),
      "--tmd-fg-faint": mix(fg, bgBase, 0.68),
      "--tmd-border": border,
      "--tmd-border-strong": mix(border, fg, 0.2),
      "--tmd-accent": accent,
      "--tmd-accent-fg": get("button.foreground", contrast(accent)),
      "--tmd-accent-soft": alpha(accent, dark ? 0.24 : 0.14),
    };
  }

  /* ── preset 目录(移植自 codemoss vscodeThemePresets.ts) ── */
  const PRESETS = JSON.parse(document.getElementById("preset-data").textContent);
  const LIST = Object.values(PRESETS);
  const byId = (id) => PRESETS[id] || PRESETS["vscode-dark-modern"];

  /* ── 状态(原型用 localStorage;实现版走 ~/.tmd-cli/settings.json) ── */
  const KEY = "proto.settings.v1";
  const state = Object.assign(
    { theme: "system", lightThemePresetId: "vscode-light-modern", darkThemePresetId: "vscode-dark-modern", customThemePresetId: "vscode-dark-modern" },
    JSON.parse(localStorage.getItem(KEY) || "{}"),
  );
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));

  const root = document.documentElement;
  const TOKEN_KEYS = Object.keys(tokensFromPreset(byId("vscode-dark-modern")));
  const systemDark = matchMedia("(prefers-color-scheme: dark)");

  function resolvedAppearance() {
    if (state.theme === "custom") return byId(state.customThemePresetId).appearance;
    if (state.theme === "system") return systemDark.matches ? "dark" : "light";
    return state.theme;
  }

  function apply() {
    const appearance = resolvedAppearance();
    root.setAttribute("data-theme", appearance);
    if (state.theme === "custom") {
      const preset = byId(state.customThemePresetId);
      root.setAttribute("data-theme-preset", preset.id);
      for (const [k, v] of Object.entries(tokensFromPreset(preset))) root.style.setProperty(k, v);
    } else {
      root.removeAttribute("data-theme-preset");
      /* light/dark 非默认 preset 也内联(实现版同样行为:light/dark 模式也吃各自 presetId) */
      const preset = byId(appearance === "light" ? state.lightThemePresetId : state.darkThemePresetId);
      for (const [k, v] of Object.entries(tokensFromPreset(preset))) root.style.setProperty(k, v);
    }

    /* segmented 态 */
    document.querySelectorAll("#theme-segmented .segment").forEach((b) => {
      const on = b.dataset.mode === state.theme;
      b.classList.toggle("is-active", on);
      b.setAttribute("aria-checked", String(on));
    });
    document.getElementById("theme-card").classList.toggle("is-custom", state.theme === "custom");
    const label = appearance === "light" ? "浅色" : "深色";
    document.getElementById("theme-hint").textContent =
      state.theme === "system" ? `当前跟随系统使用 ${label} 外观。`
      : state.theme === "custom" ? `当前使用自定义主题(${byId(state.customThemePresetId).label},${label})。`
      : `当前固定使用 ${label} 外观。`;
    renderPresetGrid();
    save();
  }

  /* ── preset 网格 ── */
  function presetThumb(p) {
    const c = p.colors;
    const side = norm(c["sideBar.background"]) || "#888";
    const main = norm(c["editor.background"]) || "#888";
    const accent = norm(c["button.background"]) || "#007acc";
    const fgC = norm(c["editor.foreground"]) || "#ccc";
    return `<div class="preset-thumb" style="background:${main}">
      <div class="preset-thumb-side" style="background:${side}"><span style="background:${alpha(accent, 0.35)}; margin:6px 4px 0; border-radius:3px"></span><span></span></div>
      <div class="preset-thumb-main">
        <i style="background:${fgC}; width:55%"></i>
        <i style="background:${accent}; width:35%"></i>
        <i style="background:${alpha(fgC, 0.5)}; width:70%"></i>
      </div>
    </div>`;
  }

  function renderPresetGrid() {
    const el = document.getElementById("preset-section");
    const groups = [["light", "浅色主题"], ["dark", "深色主题"]];
    el.innerHTML = groups.map(([ap, title]) => `
      <div class="preset-group-label">${title}</div>
      <div class="preset-grid">
        ${LIST.filter((p) => p.appearance === ap).map((p) => `
          <button class="preset-card${p.id === state.customThemePresetId ? " is-active" : ""}" type="button" data-preset="${p.id}">
            ${presetThumb(p)}
            <span class="preset-name">${p.label}
              <svg class="preset-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
          </button>`).join("")}
      </div>`).join("");
    el.querySelectorAll(".preset-card").forEach((b) => b.addEventListener("click", () => {
      state.customThemePresetId = b.dataset.preset;
      state.theme = "custom";
      apply();
    }));
  }

  document.querySelectorAll("#theme-segmented .segment").forEach((b) =>
    b.addEventListener("click", () => { state.theme = b.dataset.mode; apply(); }));
  systemDark.addEventListener("change", () => { if (state.theme === "system") apply(); });

  apply();
})();
</script>
