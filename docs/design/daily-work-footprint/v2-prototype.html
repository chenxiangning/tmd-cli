<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>tmd-cli · 每日工作足迹 · 交互原型 v2</title>
<style>
  :root{
    --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f2f3f5;
    --border:#e4e6eb; --border-strong:#d0d4dc;
    --fg:#1f2329; --fg-2:#646a73; --fg-3:#8f959e;
    --accent:#3370ff; --accent-weak:#e8efff;
    --green:#2b9e68; --green-weak:#e2f4ec;
    --red:#d54941; --red-weak:#fdeceb;
    --amber:#b8860b; --amber-weak:#fdf3e0;
    --violet:#7a5af8; --violet-weak:#efeafd;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    --shadow-1:0 1px 2px rgba(31,35,41,.05);
    --shadow-2:0 4px 14px rgba(31,35,41,.09);
    --shadow-3:0 10px 34px rgba(31,35,41,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.6 var(--sans);overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d4d7dd;border-radius:6px;border:2px solid transparent;background-clip:content-box}
  kbd{font:11px var(--mono);background:var(--surface-2);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg-2)}

  /* ============ 顶栏 ============ */
  .topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:50}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;white-space:nowrap}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .nav-arrows{display:flex;gap:2px}
  .icon-btn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--fg-2);transition:background .15s}
  .icon-btn:hover{background:var(--surface-2);color:var(--fg)}
  .icon-btn svg{width:16px;height:16px}
  .month-title{font-size:13.5px;font-weight:600;min-width:96px;text-align:center}
  .today-btn{font-size:12px;color:var(--accent);padding:3px 10px;border-radius:6px;transition:background .15s}
  .today-btn:hover{background:var(--accent-weak)}
  .searchbox{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;width:320px;color:var(--fg-3);cursor:pointer;transition:border-color .15s, background .15s}
  .searchbox:hover,.searchbox:focus-within{border-color:var(--border-strong);background:var(--surface)}
  .searchbox svg{width:14px;height:14px;flex:none}
  .searchbox input{border:none;outline:none;background:none;font:inherit;flex:1;color:var(--fg);min-width:0}
  .searchbox input::placeholder{color:var(--fg-3)}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px}
  .seg button{padding:3px 10px;border-radius:6px;font-size:12px;color:var(--fg-2);transition:all .15s}
  .seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow-1)}

  /* ============ 总布局 ============ */
  .layout{display:grid;grid-template-columns:272px 1fr;height:calc(100vh - 52px)}
  .layout.drawer-open{grid-template-columns:272px 1fr 400px}

  /* ============ 左:月历导航 ============ */
  .rail{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow-y:auto}
  .rail-section{padding:14px 14px 10px}
  .rail-label{font-size:11.5px;color:var(--fg-3);font-weight:600;letter-spacing:.4px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .dow{font-size:10.5px;color:var(--fg-3);text-align:center;padding:2px 0;font-weight:600}
  .cal .day{position:relative;aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--fg-2);cursor:pointer;transition:background .15s;border:1px solid transparent}
  .cal .day:hover{background:var(--surface-2)}
  .cal .day.other{color:var(--fg-3);opacity:.45}
  .cal .day.sel{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:700}
  .cal .day.today:not(.sel){border-color:var(--accent);color:var(--accent);font-weight:600}
  .cal .day.range{background:var(--accent-weak);border-radius:0}
  .cal .day.range.edge{border-radius:7px;background:var(--accent);color:#fff;font-weight:700}
  .cal .heat{position:absolute;bottom:3px;width:14px;height:3px;border-radius:2px}
  .cal .day.sel .heat,.cal .day.range .heat{background:rgba(255,255,255,.85)!important}
  .legend{display:flex;gap:5px;align-items:center;font-size:10.5px;color:var(--fg-3);margin-top:8px}
  .legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
  .rail-stat{padding:10px 14px;border-top:1px solid var(--border);margin-top:auto}
  .rail-stat .row{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2);padding:2px 0}
  .rail-stat .row b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
  .range-hint{font-size:11px;color:var(--accent);padding:6px 14px 0;display:none}
  .ranging .range-hint{display:block}

  /* ============ 主流 ============ */
  .main{overflow-y:auto;padding:18px 26px 60px;scroll-behavior:smooth}
  .day-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .day-head h1{font-size:20px;font-weight:700}
  .day-head .dow{color:var(--fg-3);font-size:13px}
  .live-pill{display:none;align-items:center;gap:5px;font-size:11px;color:var(--green);background:var(--green-weak);padding:2px 8px;border-radius:99px;font-weight:600}
  .live-pill i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .summary-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2);margin:6px 0 16px}
  .summary-line .chip{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:2px 10px;display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
  .chip b{color:var(--fg);font-weight:600}
  .pos{color:var(--green)} .neg{color:var(--red)}

  /* 区间汇总条 */
  .range-banner{display:none;background:var(--violet-weak);border:1px solid #ddd0fb;border-radius:10px;padding:10px 14px;margin-bottom:16px}
  .range-banner.show{display:block}
  .range-banner .rb-head{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;margin-bottom:8px}
  .range-banner .rb-head .x{margin-left:auto;font-weight:400;color:var(--fg-3);font-size:11.5px}
  .range-banner .rb-total{font-size:12px;color:var(--fg-2);display:flex;gap:14px;flex-wrap:wrap}
  .rb-bar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-top:8px}
  .rb-bar i{display:block;height:100%}

  /* 功能卡流 */
  .flow-label{font-size:11.5px;color:var(--fg-3);font-weight:600;letter-spacing:.4px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  .flow-label::after{content:"";flex:1;height:1px;background:var(--border)}
  .fcard{position:relative;display:flex;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:box-shadow .18s,border-color .18s,transform .18s;overflow:hidden}
  .fcard:hover{box-shadow:var(--shadow-2);border-color:var(--border-strong);transform:translateY(-1px)}
  .fcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fcard .stripe{width:4px;flex:none;background:var(--accent)}
  .fcard.manual .stripe{background:var(--amber)}
  .fcard-body{flex:1;padding:12px 14px 11px;min-width:0}
  .fcard-top{display:flex;align-items:center;gap:8px}
  .fcard-title{font-size:14px;font-weight:650}
  .src-badge{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px;white-space:nowrap}
  .src-badge.ai{background:var(--accent-weak);color:var(--accent)}
  .src-badge.fixed{background:var(--amber-weak);color:var(--amber)}
  .fcard-desc{margin:4px 0 8px;color:var(--fg-2);font-size:12.5px}
  .fcard-desc mark{background:transparent;color:var(--accent);font-weight:700}
  .quote{margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--border-strong);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:12px;color:var(--fg-2)}
  .quote .q-src{display:block;font-size:10.5px;color:var(--fg-3);margin-top:2px;font-family:var(--mono)}
  .fcard-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--fg-3);flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .eng-dots{display:inline-flex}
  .eng-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--surface);display:grid;place-items:center;font-size:9px;font-weight:700;font-style:normal;color:#fff;margin-left:-5px}
  .eng-dots i:first-child{margin-left:0}
  .fcard-meta .m{display:inline-flex;align-items:center;gap:4px}
  .fcard-meta svg{width:12px;height:12px}
  .fcard-actions{position:absolute;top:10px;right:10px;display:none;gap:4px}
  .fcard:hover .fcard-actions{display:flex}
  .mini-btn{font-size:11px;color:var(--fg-2);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 8px;box-shadow:var(--shadow-1)}
  .mini-btn:hover{color:var(--fg);border-color:var(--border-strong)}
  .range-date-tag{display:none;font-size:10.5px;color:var(--violet);background:var(--violet-weak);border-radius:99px;padding:1px 8px;font-weight:600}
  .in-range .range-date-tag{display:inline-flex}

  /* 未归纳日 */
  .rawday{background:var(--surface);border:1px dashed var(--border-strong);border-radius:12px;padding:14px}
  .rawday h3{font-size:13px;color:var(--fg-2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .rawday h3 .tag{font-size:10.5px;background:var(--surface-2);border:1px solid var(--border);padding:1px 8px;border-radius:99px;color:var(--fg-3);font-weight:500}
  .raw-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;font-size:12.5px;cursor:pointer;transition:background .15s}
  .raw-row:hover{background:var(--surface-2)}
  .raw-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .raw-row .hm{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
  .eng-tag{font-size:10px;font-weight:700;color:#fff;border-radius:5px;padding:1px 6px;flex:none}
  .rawday .foot{margin-top:10px;font-size:11.5px;color:var(--fg-3)}

  /* ============ 右:证据抽屉 ============ */
  .drawer{background:var(--surface);border-left:1px solid var(--border);display:none;flex-direction:column;overflow:hidden}
  .drawer-open .drawer{display:flex}
  .drawer-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .drawer-head .dh-title{font-size:14.5px;font-weight:700;padding-right:24px}
  .drawer-head .dh-sub{font-size:11.5px;color:var(--fg-3);margin-top:2px}
  .drawer-close{position:absolute;top:12px;right:12px}
  .drawer-scroll{flex:1;overflow-y:auto}
  .drawer h4{font-size:11px;color:var(--fg-3);font-weight:700;letter-spacing:.4px;padding:14px 16px 6px;display:flex;align-items:center;gap:6px}
  .drawer h4 .cnt{background:var(--surface-2);border-radius:99px;padding:0 7px;font-size:10.5px;color:var(--fg-2)}
  .sess-row{display:flex;align-items:center;gap:8px;padding:7px 16px;cursor:pointer;transition:background .15s;border-left:2px solid transparent}
  .sess-row:hover{background:var(--surface-2)}
  .sess-row.on{background:var(--accent-weak);border-left-color:var(--accent)}
  .sess-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .sess-row .hm{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);flex:none}
  .resume-btn{font-size:10.5px;color:var(--accent);border:1px solid var(--accent-weak);background:var(--accent-weak);border-radius:6px;padding:1px 8px;flex:none}
  .resume-btn:hover{background:#dbe7ff}
  .file-row{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;font-size:12px;border-left:2px solid transparent;transition:background .15s}
  .file-row:hover{background:var(--surface-2)}
  .file-row.on{background:var(--accent-weak);border-left-color:var(--accent)}
  .file-row .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px}
  .cfg-pill{flex:none;font-size:9.5px;border:1px solid var(--amber);color:var(--amber);border-radius:4px;padding:0 4px;font-weight:600}
  .pm{display:flex;flex-direction:column;width:74px;flex:none;gap:2px;align-items:flex-end}
  .pm .bar{height:4px;border-radius:2px;min-width:2px}
  .pm .nums{font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pruned{font-size:10px;color:var(--fg-3)}
  .ficos{display:inline-flex;gap:2px;flex:none;opacity:.4}
  .file-row:hover .ficos{opacity:1}
  .fico{border:0;background:transparent;color:var(--fg-3);cursor:pointer;padding:2px;border-radius:5px;line-height:0}
  .fico:hover{background:var(--surface-3);color:var(--accent)}
  .main-diff{margin:4px 0 16px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .main-diff .diff-body{max-height:360px}
  .main-diff .md-actions{margin-left:auto;display:flex;gap:2px;align-items:center}
  .attr-chip{font-size:9.5px;border-radius:4px;padding:0 5px;font-weight:600;flex:none}
  .attr-chip.ev{background:var(--accent-weak);color:var(--accent)}
  .attr-chip.inf{border:1px dashed var(--border-strong);color:var(--fg-3)}
  .attr-chip.cfg{background:#fdf1e4;color:var(--amber)}
  .diff-wrap{margin:4px 12px 16px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .diff-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:11px;color:var(--fg-2);flex-wrap:wrap}
  .diff-head .path{font-family:var(--mono);font-weight:600;color:var(--fg)}
  .diff-body{font-family:var(--mono);font-size:11.5px;line-height:1.55;max-height:300px;overflow:auto;padding:8px 0}
  .dl{display:flex;white-space:pre}
  .dl .ln{width:34px;flex:none;text-align:right;padding-right:10px;color:var(--fg-3);user-select:none;font-size:10.5px}
  .dl.add{background:var(--green-weak)} .dl.add .lc{color:#1c7a4d}
  .dl.del{background:var(--red-weak)} .dl.del .lc{color:#b03a32;text-decoration:line-through;text-decoration-color:rgba(213,73,65,.4)}
  .dl .lc{flex:1;padding-right:12px}
  .dl.hunk{background:var(--surface-2);color:var(--fg-3)}
  .degraded{padding:16px;text-align:center;color:var(--fg-3);font-size:12px}
  .degraded .big{font-size:13px;color:var(--fg-2);font-weight:600;margin-bottom:4px}
  .degraded .nums{font-family:var(--mono);margin-top:6px;color:var(--fg-2)}
  .degraded .why{margin-top:8px;font-size:11px}

  /* ============ 搜索弹层 ============ */
  .search-pop{position:absolute;top:56px;left:50%;transform:translateX(-50%) translateY(-6px);width:560px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-3);z-index:100;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
  .search-pop.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .sp-input{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .sp-input svg{width:15px;height:15px;color:var(--fg-3);flex:none}
  .sp-input input{flex:1;border:none;outline:none;font:inherit;font-size:13.5px;background:none}
  .sp-results{max-height:420px;overflow-y:auto;padding:6px}
  .sp-group{font-size:10.5px;color:var(--fg-3);font-weight:700;letter-spacing:.4px;padding:8px 10px 3px}
  .sp-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .sp-item:hover,.sp-item.on{background:var(--surface-2)}
  .sp-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sp-item mark{background:transparent;color:var(--accent);font-weight:700}
  .sp-item .d{font-size:10.5px;color:var(--fg-3);flex:none;font-variant-numeric:tabular-nums}
  .sp-kind{flex:none;font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 5px}
  .k-feat{background:var(--accent-weak);color:var(--accent)}
  .k-article{background:var(--violet-weak);color:var(--violet)}
  .k-path{background:var(--surface-2);color:var(--fg-2);font-family:var(--mono)}
  .sp-empty{padding:26px;text-align:center;color:var(--fg-3);font-size:12.5px}
  .sp-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:10.5px;color:var(--fg-3)}

  /* 快捷键浮层 / 修正菜单 / toast */
  .overlay-pop{position:absolute;top:56px;right:14px;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-3);z-index:100;display:none;padding:6px}
  .overlay-pop.show{display:block}
  .overlay-pop .oh{padding:8px 10px 4px;font-size:11px;font-weight:700;color:var(--fg-3);letter-spacing:.4px}
  .overlay-pop .or{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;font-size:12px;color:var(--fg-2)}
  .fix-menu{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-3);padding:4px;display:none;min-width:160px}
  .fix-menu.show{display:block}
  .fix-menu button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:7px;font-size:12.5px}
  .fix-menu button:hover{background:var(--surface-2)}
  #toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:#26292e;color:#fff;font-size:12px;padding:7px 16px;border-radius:99px;box-shadow:var(--shadow-3);animation:tin .2s}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .flash-note{animation:flash 1.6s}
  @keyframes flash{0%{background:var(--accent-weak)}100%{background:transparent}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>每日工作足迹 <span style="color:var(--fg-3);font-weight:400">原型 v2 · 功能卡为一级实体</span></div>
  <div class="nav-arrows">
    <button class="icon-btn" id="prevM" title="上月(⇧←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="icon-btn" id="nextM" title="下月(⇧→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="month-title" id="monthTitle"></div>
  <button class="today-btn" id="todayBtn">回到今日</button>
  <div class="searchbox" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="反查:账号密码 / 配置文件 / 路径…"/>
    <kbd>⌘K</kbd>
  </div>
  <div class="seg" id="heatSeg" title="月历热力口径">
    <button data-k="lines" class="on">按改动量</button>
    <button data-k="sessions">按会话数</button>
  </div>

function renderCal(){
  $("monthTitle").textContent=state.y+"年"+state.m+"月";
  const first=new Date(state.y,state.m-1,1), startDow=first.getDay(), dim=new Date(state.y,state.m,0).getDate();
  const prevDim=new Date(state.y,state.m-1,0).getDate();
  let html=["一","二","三","四","五","六","日"].map(d=>'<div class="dow">'+d+'</div>').join("");
  const cells=[];
  for(let i=0;i<42;i++){
    const n=i-startDow+1;
    if(n<1) cells.push({d:prevDim+n,other:true,k:null});
    else if(n>dim) cells.push({d:n-dim,other:true,k:null});
    else cells.push({d:n,k:state.y+"-"+String(state.m).padStart(2,"0")+"-"+String(n).padStart(2,"0")});
  }
  const vals=cells.filter(c=>c.k).map(c=>heatVal(c.k,state.heat)).filter(v=>v>0);
  const max=Math.max(1,...vals);
  for(const c of cells){
    if(!c.k){ html+='<div class="day other">'+c.d+'</div>'; continue; }
    const v=heatVal(c.k,state.heat);
    const tier=v===0?-1:Math.min(3,Math.floor(v/max*4));
    let cls="day";
    if(c.k===TODAY)cls+=" today";
    if(state.mode==="day"&&c.k===state.sel)cls+=" sel";
    if(state.mode==="range"&&state.range&&c.k>=state.range[0]&&c.k<=state.range[1]){
      cls+=" range"; if(c.k===state.range[0]||c.k===state.range[1])cls+=" edge";
    }
    const bg=tier>=0?HEAT_SCALE[tier+1]:"transparent";
    html+='<div class="'+cls+'" data-day="'+c.k+'" title="'+fmtD(c.k)+(v?' · '+(state.heat==="lines"?"±"+v:v+" 场"):'')+'">'
        +c.d+(v?'<span class="heat" style="background:'+bg+'"></span>':'')+'</div>';
  }
  $("cal").innerHTML=html;
  $("legend").innerHTML="弱 "+HEAT_SCALE.slice(1).map(c=>'<i style="background:'+c+'"></i>').join("")+" 强";
  /* 当月统计 */
  let sN=0,sPlus=0,sMinus=0,sDays=0;
  for(const[k,h]of Object.entries(HEAT)){ if(!k.startsWith(state.y+"-"+String(state.m).padStart(2,"0")))continue;
    sDays++; sN+=h.sessions; sPlus+=h.plus; sMinus+=h.minus; }

    '<div class="row"><span>活跃天数</span><b>'+sDays+' 天</b></div>'

   +'<div class="row"><span>改动行</span><b>+'+sPlus+' / −'+sMinus+'</b></div>';
}

    +'<span class="range-date-tag">'+fmtD(dayKey).slice(5)+'</span></div>'
    +'<div class="fcard-desc">'+hi(f.desc,q)+'</div>'

    +'<span class="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 1 1-4-6.9"/><path d="M8 11h8M8 15h5"/></svg>'+sess.length+' 场会话</span>'

    +'<span class="m pos">+'+plus+'</span><span class="m neg">−'+minus+'</span></div>'
    +'</div>'
    +'<div class="fcard-actions"><button class="mini-btn" data-fix="'+f.id+'">修正 ▾</button></div>'
    +'</div>';

  if(COMMITS[k]&&COMMITS[k].length){
    html+='<div class="flow-label">Git 硬证据(提交即权威,不受账本清理影响)</div>'
        +COMMITS[k].map(c=>'<div class="raw-row" style="cursor:default"><span class="hm" style="font-family:var(--mono);color:var(--fg-3)">'+c.time+'</span><span class="eng-tag" style="background:var(--fg-2)">git</span><span class="t" style="font-family:var(--mono);font-size:11.5px">'+esc(c.hash)+' '+esc(c.msg)+'</span></div>').join("");
  }
  if(!feats.length&&!raw.length&&!COMMITS[k].length) html+='<div class="sp-empty">该日无记录</div>';
  html+=mainDiffHTML();
  $("flow").innerHTML=html;
}
function renderRange(){
  const[a,b]=state.range;
  $("dayTitle").textContent=fmtD(a).slice(5)+" — "+fmtD(b).slice(5);
  $("dayDow").textContent="区间视图";
  const days=Object.keys(DAYS).filter(k=>k>=a&&k<=b);
  let feats=[],plus=0,minus=0,sessN=0;
  for(const k of days){ const d=DAYS[k]; if(!d)continue;
    for(const f of d.features){ feats.push([k,f]);
      plus+=f.sessions.reduce((x,s)=>x+s.plus,0); minus+=f.sessions.reduce((x,s)=>x+s.minus,0);
      sessN+=f.sessions.length; } }
  $("summaryLine").innerHTML='<span class="chip"><b>'+days.length+'</b> 天</span><span class="chip"><b>'+feats.length+'</b> 项功能</span><span class="chip"><b class="pos">+'+plus+'</b> / <b class="neg">−'+minus+'</b></span><span class="chip"><b>'+sessN+'</b> 场会话</span>';
  /* 项目横条:按主工作区(mock 简化为按功能聚合) */
  const proj={}; for(const[k,f]of feats){ const key=f.title.includes("登录")?"账号模块":"其他";
    proj[key]=proj[key]||{plus:0,minus:0}; for(const s of f.sessions){proj[key].plus+=s.plus;proj[key].minus+=s.minus;} }
  const total=Math.max(1,plus+minus);
  const colors=["#4f8dff","#7a5af8","#2b9e68","#d97757"];
  $("rangeBanner").innerHTML='<div class="rb-head">区间汇总 <span class="x">点月历任意单日退出区间</span></div>'
    +'<div class="rb-total">'+Object.entries(proj).map(([n,v])=>'<span><b>'+n+'</b> <span class="pos">+'+v.plus+'</span> <span class="neg">−'+v.minus+'</span></span>').join("")+'</div>'
    +'<div class="rb-bar">'+Object.entries(proj).map(([n,v],i)=>'<i style="width:'+((v.plus+v.minus)/total*100).toFixed(1)+'%;background:'+colors[i%4]+'" title="'+n+' ±'+(v.plus+v.minus)+'"></i>').join("")+'</div>';
  $("flow").innerHTML='<div class="flow-label">区间功能卡流(按日分组)</div>'
    +feats.map(([k,f])=>fcardHTML(f,k,true,"")).join("")
    +(feats.length?"":'<div class="sp-empty">区间内无功能归纳</div>');
}

/* ================= 主流 Diff 面板(点抽屉文件在此展开,宽面板) ================= */
function mainDiffHTML(){
  if(!state.drawerFeature||state.drawerFile===null) return "";
  const {day,fid}=state.drawerFeature;
  const f=DAYS[day]&&DAYS[day].features.find(x=>x.id===fid); if(!f)return "";
  const files=FILES_BY_FEATURE[f.id]||[]; const fl=files[state.drawerFile]; if(!fl)return "";
  const sess=f.sessions||[]; const s=sess.length?sess[state.drawerFile%sess.length]:{eng:"kimi"};
  const act=a=>'<button class="fico" data-mdact="'+a+'" title="'+(a==="open"?"打开文件":a==="folder"?"打开所在文件夹":"关闭 diff")+'">'+(a==="open"?ICO_OPEN:a==="folder"?ICO_FOLDER:ICO_X)+'</button>';
  let body;
  if(fl.pruned){
    body='<div class="degraded" style="margin:12px">'
      +'<div class="big">diff 已随账本清理(30 天 TTL)</div>'
      +'数字仍在:该文件当日 +'+fl.add+' / −'+fl.del+' · 会话与 turn 索引保留'
      +'<div class="why">诚实降级 —— 语义层(功能卡)与量化层(±)持久,字节层跟随账本生命周期,prune 可回收</div>'
      +'<div style="margin-top:10px"><button class="mini-btn" onclick="toast(\'真实实现:跳 git 提交视图(按窗口归因)\')">从 git 提交看改动 →</button></div>'
      +'</div>';
  }else{
    body='<div class="diff-body">'+DIFF.map(l=>{
      const cls=l[0]==="hunk"?"hunk":l[0]==="add"?"add":l[0]==="del"?"del":"";
      const sign=l[0]==="add"?"+":l[0]==="del"?"−":" ";
      return '<div class="dl '+cls+'"><span class="ln"></span><span class="lc">'+sign+" "+esc(l[1]||l[0])+'</span></div>';
    }).join("")+'</div>';
  }
  return '<div class="flow-label">Diff 预览(点右侧文件在此展开 · 主流宽面板)</div>'
    +'<div class="main-diff" id="mainDiff"><div class="diff-head"><span class="path">'+esc(fl.path)+'</span>'
    +'<span class="eng-tag" style="background:'+ENG[s.eng].color+'">'+s.eng+'</span>'
    +'<span>turn 3</span>'
    +(fl.attr==="events"?'<span class="attr-chip ev">events 归因</span>':'<span class="attr-chip inf">窗口推断</span>')
    +(fl.cfg?'<span class="attr-chip cfg">配置</span>':'')
    +'<span class="md-actions">'+act("open")+act("folder")+act("close")+'</span></div>'
    +body+'</div>';
}

/* ================= 证据抽屉 ================= */
function openDrawer(dayKey,fid,q){
  const f=DAYS[dayKey].features.find(x=>x.id===fid);
  state.drawerFeature={day:dayKey,fid}; state.drawerSess=0; state.drawerFile=null;
  $("layout").classList.add("drawer-open");
  $("dhTitle").textContent=f.title;
  $("dhSub").textContent=fmtD(dayKey)+" · "+(f.src==="fixed"?"用户修正":"AI 归纳 · 会话引用已校验");
  renderDrawer(f,q);
  if(q)toast("已定位到 "+fmtD(dayKey)+" · 「"+f.title+"」"+(q?" · 命中「"+q+"」":""));
}
function renderDrawer(f,q){
  const sess=f.sessions||[];
  const files=FILES_BY_FEATURE[f.id]||[];
  let html='<h4>会话 <span class="cnt">'+sess.length+'</span></h4>'
    +sess.map((s,i)=>'<div class="sess-row'+(state.drawerSess===i?" on":"")+'" data-sess="'+i+'">'
      +'<span class="eng-tag" style="background:'+ENG[s.eng].color+'">'+s.eng+'</span>'
      +'<span class="t">'+hi(s.title,q)+'</span><span class="hm">'+s.hm+'</span>'
      +'<button class="resume-btn">resume</button></div>').join("")
    +'<h4>改动文件 <span class="cnt">'+files.length+'</span> <span style="font-weight:400;text-transform:none">· 点文件在左侧出 diff · 数字永久,diff 随账本 30 天</span></h4>'
    +files.map((fl,i)=>{
      const pw=Math.min(38,fl.add/6),mw=Math.min(38,fl.del/6);
      return '<div class="file-row'+(state.drawerFile===i?" on":"")+'" data-file="'+i+'">'
        +'<span class="p">'+esc(fl.path)+(fl.cfg?'<span class="cfg-pill">配置</span>':'')+'</span>'
        +'<span class="ficos">'
          +'<button class="fico" data-act="open" title="打开文件">'+ICO_OPEN+'</button>'
          +'<button class="fico" data-act="folder" title="打开所在文件夹">'+ICO_FOLDER+'</button>'
        +'</span>'
        +'<span class="pm">'+(fl.pruned?'<span class="pruned">账本已清理</span>'
          :'<span class="bar" style="width:'+pw+'px;background:var(--green)"></span><span class="bar" style="width:'+mw+'px;background:var(--red)"></span>')
        +'<span class="nums"><span class="pos">+'+fl.add+'</span> <span class="neg">−'+fl.del+'</span></span></span></div>';
    }).join("");
  $("drawerScroll").innerHTML=html;
}
$("drawerScroll").addEventListener("click",e=>{
  const sr=e.target.closest(".sess-row");
  if(sr){ state.drawerSess=+sr.dataset.sess; state.drawerFile=null;
    const {day,fid}=state.drawerFeature; renderDrawer(DAYS[day].features.find(x=>x.id===fid),null); renderMain();
    if(e.target.closest(".resume-btn"))toast("演示:resume 复用会话(接 tmd 会话系统)");
    return; }
  const fico=e.target.closest(".fico");
  if(fico){ e.stopPropagation();
    toast(fico.dataset.act==="open"?"真实实现:调系统默认程序打开该文件":"真实实现:在系统文件管理器中显示所在目录");
    return; }
  const fr=e.target.closest(".file-row");
  if(fr){ state.drawerFile=+fr.dataset.file;
    const {day,fid}=state.drawerFeature; renderDrawer(DAYS[day].features.find(x=>x.id===fid),null); renderMain();
    requestAnimationFrame(()=>{ const md=$("mainDiff"); if(md)md.scrollIntoView({behavior:"smooth",block:"nearest"}); }); }
});
$("drawerClose").onclick=()=>{ state.drawerFeature=null; $("layout").classList.remove("drawer-open"); };

/* 卡点击 / 修正菜单 */
$("flow").addEventListener("click",e=>{
  const md=e.target.closest("[data-mdact]");
  if(md){ const a=md.dataset.mdact;
    if(a==="close"){ state.drawerFile=null;
      if(state.drawerFeature){ const {day,fid}=state.drawerFeature;
        renderDrawer(DAYS[day].features.find(x=>x.id===fid),null); } }
    else toast(a==="open"?"真实实现:调系统默认程序打开该文件":"真实实现:在系统文件管理器中显示所在目录");
    renderMain(); return; }
  const fix=e.target.closest("[data-fix]");
  if(fix){ e.stopPropagation();
    const m=$("fixMenu"); m.classList.add("show");
    const r=fix.getBoundingClientRect(); m.style.top=(r.bottom+4)+"px"; m.style.left=(r.left-120)+"px"; return; }
  const card=e.target.closest(".fcard");
  if(card) openDrawer(card.dataset.day,card.dataset.f,null);
});
$("flow").addEventListener("keydown",e=>{
  if(e.key==="Enter"){ const card=e.target.closest(".fcard");
    if(card){ e.preventDefault(); openDrawer(card.dataset.day,card.dataset.f,null); } }
});
$("fixMenu").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  $("fixMenu").classList.remove("show");
  toast("修正层演示:真实实现落盘优先于 AI 归纳("+( {rename:"重命名",merge:"合并",split:"拆分",none:"标记无关"}[b.dataset.a] )+")");
});
document.addEventListener("click",e=>{ if(!e.target.closest("#fixMenu")&&!e.target.closest("[data-fix]"))$("fixMenu").classList.remove("show"); });

/* ================= 搜索反查 ================= */
const searchIndex=[];
(function(){ for(const[k,d]of Object.entries(DAYS)){ if(!d)continue;
  for(const f of d.features){ searchIndex.push({kind:"feat",day:k,ref:f.id,title:f.title,detail:f.desc});
    for(const s of f.sessions) searchIndex.push({kind:"sess",day:k,ref:f.id,title:s.title,detail:""});
    for(const qu of (f.quotes||[])) searchIndex.push({kind:"quote",day:k,ref:f.id,title:qu.text,detail:""}); } }
  for(const[k,t]of Object.entries(ARTICLES)){ if(!t)continue;
    t.split("\n").forEach(line=>{ if(line.trim())searchIndex.push({kind:"article",day:k,ref:null,title:line.replace(/^#+\s*/,""),detail:""}); }); }
  searchIndex.push({kind:"path",day:"2026-08-14",ref:"f1",title:"admin-web/src/pages/login.tsx",detail:""});
  searchIndex.push({kind:"path",day:"2026-08-14",ref:"f2",title:"auth/internal/config.yaml",detail:"配置"});
})();
function renderSearch(q){
  const box=$("spResults");
  if(!q){ box.innerHTML='<div class="sp-empty">输入关键词,从功能卡 / 日报 / 用户原话 / 文件路径四个来源反查历史</div>'; return; }
  const ql=q.toLowerCase();
  const hits=searchIndex.filter(x=>(x.title+" "+x.detail).toLowerCase().includes(ql)).slice(0,30);
  if(!hits.length){ box.innerHTML='<div class="sp-empty">无命中</div>'; return; }
  const grp={feat:"功能卡",quote:"用户原话",sess:"会话标题",article:"日报",path:"文件路径"};
  let html="",lastKind=null;
  for(const h of hits){ if(h.kind!==lastKind){ html+='<div class="sp-group">'+grp[h.kind]+'</div>'; lastKind=h.kind; }
    const kindClass=h.kind==="feat"?"k-feat":h.kind==="article"?"k-article":"k-path";
    html+='<div class="sp-item" data-day="'+h.day+'" data-ref="'+(h.ref||"")+'" data-q="'+esc(q)+'">'
      +'<span class="sp-kind '+kindClass+'">'+(h.kind==="feat"?"功能":h.kind==="article"?"日报":h.kind==="path"?"路径":h.kind==="quote"?"原话":"会话")+'</span>'
      +'<span class="t">'+hi(h.title,q)+(h.detail&&h.kind!=="path"?" <span style='color:var(--fg-3)'>· "+hi(h.detail,q)+"</span>":"")+'</span>'
      +'<span class="d">'+fmtD(h.day).slice(5)+'</span></div>'; }
  box.innerHTML=html;
}
function openSearch(focus){ $("searchPop").classList.add("show"); renderSearch(""); if(focus!==false)$("spReal").focus(); }
function closeSearch(){ $("searchPop").classList.remove("show"); $("spReal").blur(); $("searchInput").blur(); }
$("searchBox").addEventListener("click",()=>openSearch());
$("searchInput").addEventListener("focus",()=>openSearch());
$("searchInput").addEventListener("input",e=>{ openSearch(false); $("spReal").value=e.target.value; renderSearch(e.target.value); });
$("spReal").addEventListener("input",e=>{ $("searchInput").value=e.target.value; renderSearch(e.target.value); });
$("spResults").addEventListener("click",e=>{
  const it=e.target.closest(".sp-item"); if(!it)return;
  closeSearch(); const k=it.dataset.day;
  state.mode="day"; state.sel=k; state.range=null;
  if(it.dataset.ref){ renderAll(); openDrawer(k,it.dataset.ref,it.dataset.q); }
  else{ renderAll(); toast("已定位到 "+fmtD(k)+" 的日报"); }
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault();
    $("searchPop").classList.contains("show")?closeSearch():openSearch(); return; }
  const typing=/input|textarea/i.test(e.target.tagName);
  if(e.key==="Escape"){ closeSearch(); $("helpPop").classList.remove("show"); $("fixMenu").classList.remove("show");
    if(state.drawerFeature){ state.drawerFeature=null; $("layout").classList.remove("drawer-open"); } return; }
  if(typing)return;
  if(e.key==="?"){ $("helpPop").classList.toggle("show"); return; }
  if(e.key==="ArrowLeft"){ shiftDay(-1); return; }
  if(e.key==="ArrowRight"){ shiftDay(1); return; }
  if(e.key==="1"||e.key==="2"){ setHeat(e.key==="1"?"lines":"sessions"); return; }
  if(e.key.toLowerCase()==="t"){ clickDay(TODAY); return; }
  if(e.key.toLowerCase()==="j"||e.key.toLowerCase()==="k"){
    const cards=[...document.querySelectorAll(".fcard")]; if(!cards.length)return;
    e.preventDefault();
    const idx=cards.indexOf(document.activeElement);
    const next=e.key.toLowerCase()==="j"?Math.min(cards.length-1,idx+1):Math.max(0,idx-1);
    cards[next].focus(); cards[next].scrollIntoView({block:"nearest"}); return; }
});
function shiftDay(n){
  if(state.mode==="range"){ state.mode="day"; state.range=null; }
  const d=new Date(state.sel+"T12:00:00"); d.setDate(d.getDate()+n);
  clickDay(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
}
function setHeat(mode){ state.heat=mode;
  document.querySelectorAll("#heatSeg button").forEach(b=>b.classList.toggle("on",b.dataset.k===mode));
  renderCal(); }
$("heatSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b)setHeat(b.dataset.k); });
$("prevM").onclick=()=>{ state.m--; if(state.m<1){state.m=12;state.y--;} renderCal(); };
$("nextM").onclick=()=>{ state.m++; if(state.m>12){state.m=1;state.y++;} renderCal(); };
$("todayBtn").onclick=()=>clickDay(TODAY);
$("helpBtn").onclick=()=>$("helpPop").classList.toggle("show");

function renderAll(){ renderCal(); renderMain();
  if(state.drawerFeature){ const{day,fid}=state.drawerFeature;
    if(DAYS[day]&&DAYS[day].features.find(x=>x.id===fid))renderDrawer(DAYS[day].features.find(x=>x.id===fid),null);
    else{ state.drawerFeature=null; $("layout").classList.remove("drawer-open"); } } }
renderAll();
</script>
</body>
</html>
