else if(b.dataset.undo!==undefined){const r=applies[Number(b.dataset.undo)];r.undone=true;render();toast('已撤销这次修改；撤销动作也已记录')}
else if(b.hasAttribute('data-close-modal')){state.modal=null;renderModal()}});
document.addEventListener('input',e=>{if(e.target.id==='editor-area'){const f=currentFile();state.contents[f.id]=e.target.value;state.dirty[f.id]=true;const save=$('[data-save]');save.disabled=false;save.classList.add('primary');$('.statusbar span:last-child').textContent='有未保存修改'}if(e.target.id==='modal-draft')state.draft=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='engine'){state.engine=e.target.value;state.model='';renderSide();return}if(e.target.id==='model'){state.model=e.target.value;return}if(e.target.dataset.scanScope==='project')state.scanProject=e.target.checked;if(e.target.dataset.scanScope==='global')state.scanGlobal=e.target.checked});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'&&$('#editor-area')){e.preventDefault();$('[data-save]')?.click()}if(e.key==='Escape'&&state.modal){state.modal=null;renderModal()}});
render();
</script>
</body></html>
