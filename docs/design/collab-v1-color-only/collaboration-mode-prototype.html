<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tmd-cli · 协作思维导图</title>
<style>
/* ════════════════════════════════════════════════════════════════════════
   Mindmap Theme — deep obsidian + amber accent
   ════════════════════════════════════════════════════════════════════════ */
:root[data-theme="dark"] {
  --bg: #0a0a0f;
  --bg-elev: #12121a;
  --bg-card: #1a1a24;
  --bg-hover: #22222e;
  --line: #2a2a3a;
  --text: #e8e8f0;
  --soft: #a0a0b8;
  --dim: #6a6a80;
  --faint: #404050;
  --accent: #f5a623;
  --accent-glow: rgba(245,166,35,0.15);
  --done: #4caf7a;
  --done-glow: rgba(76,175,122,0.12);
  --wait: #4a4a5a;
  --fail: #e06060;
  --shadow: rgba(0,0,0,0.5);
  --font: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono: 'SF Mono',Monaco,Inconsolata,monospace;
  --ease: cubic-bezier(.23,1,.32,1);
}

* { box-sizing:border-box; margin:0; padding:0 }
html,body { height:100%; font-family:var(--font); font-size:13px; line-height:1.5; color:var(--soft); background:var(--bg); overflow:hidden }

.app { display:flex; flex-direction:column; height:100vh }

/* ════════════════════════════════════════════════════════════════════════
   Top Bar
   ════════════════════════════════════════════════════════════════════════ */
.topbar { height:40px; background:var(--bg-elev); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 16px; gap:12px; flex-shrink:0 }
.brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px; color:var(--text) }
.brand-mark { width:20px; height:20px; border-radius:5px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:11px; color:#000 }
.breadcrumb { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim) }
.bc-active { color:var(--accent); font-weight:500 }
.status { margin-left:auto; display:flex; align-items:center; gap:8px }
.badge { display:flex; align-items:center; gap:6px; padding:3px 10px; border-radius:6px; background:var(--bg-card); border:1px solid var(--line); font-size:11px }
.badge .dot { width:6px; height:6px; border-radius:50%; background:var(--faint) }
.badge.working .dot { background:var(--accent); animation:pulse 1.5s ease-in-out infinite }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ════════════════════════════════════════════════════════════════════════
   Body
   ════════════════════════════════════════════════════════════════════════ */
.body { display:flex; flex:1; min-height:0 }

/* ── Mindmap Canvas ───────────────────────────────────────────────────── */
.mindmap-wrap { flex:1; position:relative; overflow:hidden; background:var(--bg); cursor:grab }
.mindmap-wrap.dragging { cursor:grabbing }
.mindmap-wrap::before { content:''; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle at center, var(--line) .5px, transparent .5px); background-size:32px 32px; opacity:.25 }

#mindmapSvg { width:100%; height:100%; display:block }

/* SVG Styles */
.mind-link { fill:none; stroke:var(--line); stroke-width:2; stroke-linecap:round; transition:stroke 500ms var(--ease) }
.mind-link.active { stroke:var(--accent); stroke-dasharray:8 6; animation:flow 1.5s linear infinite }
.mind-link.done { stroke:var(--done); opacity:.7 }
.mind-link.wait { stroke:var(--wait); opacity:.4 }
@keyframes flow { to { stroke-dashoffset:-28 } }

.mind-node { cursor:pointer; transition:opacity 300ms var(--ease) }
.mind-node:hover { opacity:.95 }
.mind-node.collapsed .mind-children { display:none }

.mind-shape { transition:all 500ms var(--ease) }
.mind-shape.center { fill:var(--accent); filter:drop-shadow(0 0 20px var(--accent-glow)) }
.mind-shape.active { fill:var(--bg-card); stroke:var(--accent); stroke-width:2; filter:drop-shadow(0 0 16px var(--accent-glow)) }
.mind-shape.done { fill:var(--bg-card); stroke:var(--done); stroke-width:1.5; filter:drop-shadow(0 0 12px var(--done-glow)) }
.mind-shape.wait { fill:var(--bg-card); stroke:var(--wait); stroke-width:1.5 }
.mind-shape.fail { fill:var(--bg-card); stroke:var(--fail); stroke-width:2 }

.mind-text { fill:var(--text); font-family:var(--font); font-weight:600; text-anchor:middle; dominant-baseline:central; pointer-events:none }
.mind-text.sub { fill:var(--soft); font-size:11px; font-weight:400 }
.mind-text.meta { fill:var(--dim); font-size:10px; font-weight:400 }

.mind-icon { pointer-events:none }

/* Status ring */
.status-ring { fill:none; stroke-width:2.5; stroke-linecap:round }
.status-ring.active { stroke:var(--accent); stroke-dasharray:18 38; animation:spin 1.2s linear infinite }
.status-ring.done { stroke:var(--done) }
@keyframes spin { to { transform:rotate(360deg) } }

/* Collapse toggle */
.toggle-btn { cursor:pointer; fill:var(--bg-card); stroke:var(--line); stroke-width:1.5 }
.toggle-btn:hover { stroke:var(--soft) }
.toggle-icon { fill:var(--dim); font-size:10px; text-anchor:middle; dominant-baseline:central; pointer-events:none }

/* Agent chip inside node */
.agent-chip { fill:var(--bg-elev); font-family:var(--mono); font-size:9px; font-weight:700; text-anchor:middle }

/* Glow effect for active nodes */
.glow-active { filter:drop-shadow(0 0 24px rgba(245,166,35,0.2)) }
.glow-done { filter:drop-shadow(0 0 16px rgba(76,175,122,0.15)) }

/* Canvas controls */
.canvas-tools { position:absolute; right:16px; bottom:16px; display:flex; align-items:center; gap:4px;
  padding:4px; border-radius:10px; background:var(--bg-elev); border:1px solid var(--line); box-shadow:0 4px 16px var(--shadow) }
.tool-btn { width:32px; height:32px; border-radius:7px; border:none; background:transparent; color:var(--dim); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; transition:.15s }
.tool-btn:hover { background:var(--bg-hover); color:var(--soft) }
.tool-zoom { font-size:11px; color:var(--dim); min-width:40px; text-align:center; font-variant-numeric:tabular-nums }

/* ════════════════════════════════════════════════════════════════════════
   Inspector (Right Panel)
   ════════════════════════════════════════════════════════════════════════ */
.inspector { width:300px; background:var(--bg-elev); border-left:1px solid var(--line); display:flex; flex-direction:column; flex-shrink:0 }
.insp-head { padding:16px; border-bottom:1px solid var(--line) }
.insp-kicker { font-size:10px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.08em }
.insp-title { margin-top:6px; font-size:20px; font-weight:700; color:var(--text); letter-spacing:-.02em }
.insp-sub { margin-top:4px; font-size:12px; color:var(--dim) }
.insp-body { flex:1; overflow:auto; padding:0 16px 16px }
.insp-body::-webkit-scrollbar { width:5px }
.insp-body::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px }

.sect { padding:16px 0; border-top:1px solid var(--line) }
.sect:first-child { border-top:none }
.sect-label { font-size:10px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px }

.pill-row { display:flex; gap:6px; flex-wrap:wrap }
.pill { padding:3px 10px; border-radius:5px; font-size:11px; font-weight:500 }
.pill.accent { color:var(--accent); background:var(--accent-glow); border:1px solid rgba(245,166,35,0.2) }
.pill.done { color:var(--done); background:var(--done-glow); border:1px solid rgba(76,175,122,0.2) }
.pill.wait { color:var(--dim); background:var(--bg-card); border:1px solid var(--line) }

.task-list { display:flex; flex-direction:column; gap:6px }
.task-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:var(--bg-card); cursor:pointer; transition:.15s }
.task-item:hover { background:var(--bg-hover) }
.task-marker { width:18px; height:18px; flex-shrink:0 }
.task-title { font-size:12px; color:var(--soft); flex:1 }
.task-item.done .task-title { color:var(--dim); text-decoration:line-through }
.task-meta { font-size:10px; color:var(--faint); flex-shrink:0 }

.pty-box { padding:12px; border-radius:8px; background:var(--bg); border:1px solid var(--line);
  font-family:var(--mono); font-size:11px; line-height:1.6; color:var(--dim) }
.pty-box .p { color:var(--accent) }
.pty-box .c { color:var(--soft) }
.pty-box .s { color:var(--done) }

/* ════════════════════════════════════════════════════════════════════════
   Composer
   ════════════════════════════════════════════════════════════════════════ */
.composer { border-top:1px solid var(--line); background:var(--bg-elev); flex-shrink:0 }
.comp-body { padding:10px 16px; display:flex; gap:8px; align-items:flex-end }
.comp-pill { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:7px;
  border:1px solid var(--line); background:var(--bg-card); color:var(--dim); font-size:12px; cursor:pointer; font-weight:500 }
.comp-pill:hover { background:var(--bg-hover) }
.comp-pill .dot { width:5px; height:5px; border-radius:50%; background:currentColor }
.comp-ta { flex:1; background:var(--bg-card); border:1px solid var(--line); border-radius:8px; padding:8px 12px;
  color:var(--soft); font-size:13px; resize:none; outline:none; min-height:36px; max-height:120px; font-family:inherit }
.comp-ta:focus { border-color:var(--accent) }
.comp-send { width:32px; height:32px; border-radius:8px; border:none; background:var(--accent); color:#000; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700 }

/* ════════════════════════════════════════════════════════════════════════
   Modal
   ════════════════════════════════════════════════════════════════════════ */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .25s }
.modal-overlay.on { opacity:1; pointer-events:auto }
.modal { background:var(--bg-elev); border:1px solid var(--line); border-radius:16px; width:700px; max-width:92vw; max-height:85vh; display:flex; flex-direction:column; box-shadow:0 16px 48px var(--shadow); transform:scale(.96); transition:transform .3s var(--ease) }
.modal-overlay.on .modal { transform:scale(1) }
.modal-head { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between }
.modal-title { font-weight:600; font-size:15px; color:var(--text) }
.modal-close { background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; width:28px; height:28px; border-radius:6px }
.modal-close:hover { background:var(--bg-hover); color:var(--soft) }
.modal-body { padding:18px; overflow:auto }

.grow { flex:1 }
.hidden { display:none !important }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">&#9889;</div>
      <span>tmd-cli</span>
    </div>
    <div class="breadcrumb">
      <span>思维导图</span>
      <span style="color:var(--faint)">/</span>
      <span class="bc-active">bug-fix 协作</span>
    </div>
    <div class="status">
      <span class="badge working"><span class="dot"></span>修复 · 运行中</span>
      <span class="badge"><span class="dot" style="background:var(--done)"></span>2/4 完成</span>
    </div>
  </header>

  <div class="body">
    <!-- Mindmap Canvas -->
    <div class="mindmap-wrap" id="mindWrap">
      <svg id="mindmapSvg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="world"></g>
      </svg>
      <div class="canvas-tools">
        <button class="tool-btn" onclick="zoomBy(0.85)" title="缩小">&#8722;</button>
        <span class="tool-zoom" id="zoomLabel">100%</span>
        <button class="tool-btn" onclick="zoomBy(1.18)" title="放大">&#43;</button>
        <button class="tool-btn" onclick="fitView()" title="适配">&#9679;</button>
      </div>
    </div>

    <!-- Inspector -->
    <aside class="inspector" id="inspector">
      <div class="insp-head">
        <div class="insp-kicker">NODE DETAIL</div>
        <div class="insp-title" id="inspTitle">修复</div>
        <div class="insp-sub" id="inspSub">Codex CLI · Medium · 运行中</div>
      </div>
      <div class="insp-body">
        <div class="sect">
          <div class="sect-label">Status</div>
          <div class="pill-row">
            <span class="pill accent">运行中</span>
            <span class="pill wait">3m 42s</span>
          </div>
        </div>
        <div class="sect">
          <div class="sect-label">Tasks</div>
          <div class="task-list">
            <div class="task-item done">
              <svg class="task-marker" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--done)" stroke-width="2"/><path d="M7 12l3 3 5-5" stroke="var(--done)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
              <span class="task-title">诊断复现路径</span>
              <span class="task-meta">12s</span>
            </div>
            <div class="task-item">
              <svg class="task-marker" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="18 38"/><circle cx="12" cy="12" r="3" fill="var(--accent)"/></svg>
              <span class="task-title">实施最小修复</span>
              <span class="task-meta">3m 42s</span>
            </div>
            <div class="task-item">
              <svg class="task-marker" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--wait)" stroke-width="2"/></svg>
              <span class="task-title">跑回归测试</span>
              <span class="task-meta">等待</span>
            </div>
          </div>
        </div>
        <div class="sect">
          <div class="sect-label">Live Output</div>
          <div class="pty-box">
            <span class="p">$</span> <span class="c">cargo test</span>
            <br><span class="s">&#10003; test result: ok. 42 passed</span>
            <br><span class="p">$</span> <span class="c">git diff --stat</span>
            <br> src/kernel/collab.rs | 12 ++++++++
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Composer -->
  <div class="composer">
    <div class="comp-body">
      <div class="comp-pill" style="border-color:var(--accent);color:var(--accent);background:var(--accent-glow)">
        <span class="dot"></span>
        <span>bug-fix</span>
      </div>
      <textarea class="comp-ta" rows="1" placeholder="输入消息..."></textarea>
      <button class="comp-send">&#10148;</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   Mindmap Data Structure
   ════════════════════════════════════════════════════════════════════════ */
const tree = {
  id: 'root',
  label: '修 Bug',
  sub: '协作任务',
  status: 'active',
  type: 'center',
  agent: 'user',
  collapsed: false,
  children: [
    {
      id: 'n1', label: '复现定位', sub: 'Claude Code · High', status: 'done', agent: 'claude',
      collapsed: true,
      children: [
        { id: 'n1a', label: '分析 race condition', sub: '', status: 'done', agent: 'claude' },
        { id: 'n1b', label: '定位 chainTokens', sub: '', status: 'done', agent: 'claude' },
        { id: 'n1c', label: '输出 SUMMARY', sub: '已批准', status: 'done', agent: 'claude' },
      ]
    },
    {
      id: 'n2', label: '修复', sub: 'Codex CLI · Medium', status: 'active', agent: 'codex',
      collapsed: false,
      children: [
        { id: 'n2a', label: 'cargo test', sub: '42 passed', status: 'done', agent: 'codex' },
        { id: 'n2b', label: 'git diff', sub: '12 insertions', status: 'active', agent: 'codex' },
        { id: 'n2c', label: 'cargo clippy', sub: '0 warnings', status: 'pending', agent: 'codex' },
      ]
    },
    {
      id: 'n3', label: '回归加固', sub: 'Claude Code · Medium', status: 'pending', agent: 'claude',
      collapsed: true,
      children: [
        { id: 'n3a', label: '补边界测试', sub: '等待', status: 'pending', agent: 'claude' },
        { id: 'n3b', label: '手测清单', sub: '等待', status: 'pending', agent: 'claude' },
      ]
    },
    {
      id: 'n4', label: '审查收口', sub: 'Grok CLI · Medium', status: 'pending', agent: 'grok',
      collapsed: true,
      children: [
        { id: 'n4a', label: '输出汇总', sub: '等待', status: 'pending', agent: 'grok' },
      ]
    },
  ]
};

const AGENTS = { claude: '#d97757', codex: '#58a6ff', grok: '#a855f7', kimi: '#22c55e', user: '#f5a623' };

/* ════════════════════════════════════════════════════════════════════════
   Layout Engine: Radial Tree
   ════════════════════════════════════════════════════════════════════════ */
function measureNode(node) {
  const labelLen = node.label.length;
  const w = Math.max(100, labelLen * 14 + 40);
  const h = node.sub ? 52 : 36;
  return { w, h };
}

function layoutTree(root, cx, cy) {
  const nodes = [];
  const links = [];

  // Center node
  const cw = 140, ch = 60;
  nodes.push({ ...root, x: cx, y: cy, w: cw, h: ch, level: 0, parent: null });

  if (root.collapsed) return { nodes, links };

  const children = root.children || [];
  const count = children.length;
  const startAngle = -Math.PI / 2 - (count - 1) * 0.22;
  const angleStep = 0.44;
  const radius = 220;

  children.forEach((child, i) => {
    const angle = startAngle + i * angleStep;
    const { w, h } = measureNode(child);
    const nx = cx + Math.cos(angle) * radius;
    const ny = cy + Math.sin(angle) * radius * 0.55; // flatten vertically

    nodes.push({ ...child, x: nx, y: ny, w, h, level: 1, parent: root.id, angle });
    links.push({ from: root.id, to: child.id, status: child.status });

    if (!child.collapsed && child.children) {
      const gc = child.children;
      const gcRadius = 140;
      const gcStart = angle - (gc.length - 1) * 0.18;
      const gcStep = 0.36;

      gc.forEach((gchild, j) => {
        const ga = gcStart + j * gcStep;
        const { w: gw, h: gh } = measureNode(gchild);
        const gx = nx + Math.cos(ga) * gcRadius;
        const gy = ny + Math.sin(ga) * gcRadius * 0.55;

        nodes.push({ ...gchild, x: gx, y: gy, w: gw, h: gh, level: 2, parent: child.id, angle: ga });
        links.push({ from: child.id, to: gchild.id, status: gchild.status });
      });
    }
  });

  return { nodes, links };
}

/* ════════════════════════════════════════════════════════════════════════
   SVG Rendering
   ════════════════════════════════════════════════════════════════════════ */
let zoom = 1;
let pan = { x: 0, y: 0 };
let dragging = false;
let dragStart = { x: 0, y: 0 };
let panStart = { x: 0, y: 0 };

function render() {
  const svg = document.getElementById('world');
  const wrap = document.getElementById('mindWrap');
  const cx = wrap.clientWidth / 2;
  const cy = wrap.clientHeight / 2;

  const { nodes, links } = layoutTree(tree, 0, 0);
  let html = '';

  // Links (draw first, behind nodes)
  links.forEach(link => {
    const from = nodes.find(n => n.id === link.from);
    const to = nodes.find(n => n.id === link.to);
    if (!from || !to) return;

    // Organic curve
    const sx = from.x + (to.x > from.x ? from.w / 2 : -from.w / 2);
    const sy = from.y;
    const ex = to.x + (to.x > from.x ? -to.w / 2 : to.w / 2);
    const ey = to.y;
    const mx = (sx + ex) / 2;
    const d = `M${sx},${sy} C${mx},${sy} ${mx},${ey} ${ex},${ey}`;

    const cls = link.status === 'active' ? 'active' : link.status === 'done' ? 'done' : 'wait';
    html += `<path class="mind-link ${cls}" d="${d}"/>`;
  });

  // Nodes
  nodes.forEach(node => {
    const isCenter = node.type === 'center';
    const isActive = node.status === 'active';
    const isDone = node.status === 'done';
    const isFail = node.status === 'fail';
    const hasChildren = node.children && node.children.length > 0;
    const color = AGENTS[node.agent] || 'var(--dim)';

    html += `<g class="mind-node ${node.collapsed ? 'collapsed' : ''} ${isActive ? 'glow-active' : isDone ? 'glow-done' : ''}" id="node-${node.id}" onclick="selectNode('${node.id}')">`;

    // Shape
    const rx = isCenter ? 30 : 12;
    const shapeCls = isCenter ? 'center' : isActive ? 'active' : isDone ? 'done' : isFail ? 'fail' : 'wait';
    html += `<rect class="mind-shape ${shapeCls}" x="${node.x - node.w/2}" y="${node.y - node.h/2}" width="${node.w}" height="${node.h}" rx="${rx}"/>`;

    // Top accent bar
    if (!isCenter) {
      const barColor = isActive ? 'var(--accent)' : isDone ? 'var(--done)' : 'var(--wait)';
      html += `<rect x="${node.x - node.w/2 + 2}" y="${node.y - node.h/2 + 2}" width="${node.w - 4}" height="2.5" rx="1.25" fill="${barColor}" opacity=".7"/>`;
    }

    // Text
    html += `<text class="mind-text" x="${node.x}" y="${node.y - (node.sub ? 6 : 0)}" font-size="${isCenter ? 16 : 13}">${node.label}</text>`;
    if (node.sub) {
      html += `<text class="mind-text sub" x="${node.x}" y="${node.y + 12}">${node.sub}</text>`;
    }

    // Agent dot
    if (!isCenter) {
      html += `<circle cx="${node.x + node.w/2 - 12}" cy="${node.y - node.h/2 + 12}" r="5" fill="${color}"/>`;
    }

    // Collapse toggle
    if (hasChildren) {
      const tx = node.x + node.w/2 + 10;
      const ty = node.y;
      html += `<circle class="toggle-btn" cx="${tx}" cy="${ty}" r="9" onclick="event.stopPropagation();toggleCollapse('${node.id}')"/>`;
      html += `<text class="toggle-icon" x="${tx}" y="${ty}">${node.collapsed ? '+' : '−'}</text>`;
    }

    html += `</g>`;
  });

  svg.innerHTML = html;
  updateTransform();
}

function updateTransform() {
  const world = document.getElementById('world');
  const wrap = document.getElementById('mindWrap');
  const cx = wrap.clientWidth / 2;
  const cy = wrap.clientHeight / 2;
  world.setAttribute('transform', `translate(${cx + pan.x}, ${cy + pan.y}) scale(${zoom})`);
  document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
}

function zoomBy(f) {
  zoom = Math.max(0.3, Math.min(3, zoom * f));
  updateTransform();
}

function fitView() {
  zoom = 1;
  pan = { x: 0, y: 0 };
  updateTransform();
}

function toggleCollapse(id) {
  function walk(n) {
    if (n.id === id) { n.collapsed = !n.collapsed; return true; }
    if (n.children) for (const c of n.children) if (walk(c)) return true;
    return false;
  }
  walk(tree);
  render();
}

function selectNode(id) {
  // Update inspector
  function find(n) {
    if (n.id === id) return n;
    if (n.children) for (const c of n.children) { const f = find(c); if (f) return f; }
    return null;
  }
  const node = find(tree);
  if (!node) return;

  document.getElementById('inspTitle').textContent = node.label;
  document.getElementById('inspSub').textContent = node.sub || `${node.agent} · ${node.status}`;

  // Highlight
  document.querySelectorAll('.mind-shape').forEach(s => s.style.filter = '');
  const el = document.getElementById('node-' + id);
  if (el) el.querySelector('.mind-shape').style.filter = 'drop-shadow(0 0 20px var(--accent-glow))';
}

/* Pan / Zoom */
const wrap = document.getElementById('mindWrap');
wrap.addEventListener('pointerdown', e => {
  if (e.target.closest('.mind-node')) return;
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  panStart = { ...pan };
  wrap.classList.add('dragging');
  wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener('pointermove', e => {
  if (!dragging) return;
  pan.x = panStart.x + (e.clientX - dragStart.x);
  pan.y = panStart.y + (e.clientY - dragStart.y);
  updateTransform();
});
wrap.addEventListener('pointerup', () => { dragging = false; wrap.classList.remove('dragging'); });
wrap.addEventListener('pointercancel', () => { dragging = false; wrap.classList.remove('dragging'); });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.1 : 0.9);
}, { passive: false });

// Init
render();
window.addEventListener('resize', render);
</script>
</body>
</html>
